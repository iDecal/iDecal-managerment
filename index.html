/* iDecal visual refinement: Roboto + clean, consistent line icons */
html, body, button, input, select, textarea {
  font-family: 'Roboto', Arial, sans-serif;
}
svg.i {
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.8;
  filter: none;
  flex-shrink: 0;
}
button .i, a .i, .btn .i { vertical-align: middle; }

  background: #eaf3fb;
  color: #1769aa;

  background: #0879c9;
  color: #fff;

/* ================= UI v3: bảng màu + bố cục mới (theo ảnh mẫu), responsive ================= */
:root{--bg:#f4f5fb;--card:#fff;--tx:#151a30;--mut:#6b7186;--pri:#1f4fd8;--pri-d:#173fb0;--soft:#eaf0ff;--ok:#12934a;--warn:#c77a0a;--bad:#df3f45;--bd:#e6e8f2;--hh:64px;
  --sh:0 2px 12px rgba(30,40,100,.05);--r:22px;
  --ok-bg:#e3f6ea;--ok-tx:#0f7a3c;--wr-bg:#fdf0d9;--wr-tx:#965600;--bd-bg:#fdeaea;--bd-tx:#b3262d;--g-bg:#e5f6ec;--g-tx:#12934a;--o-bg:#fdf0d9;--o-tx:#c77a0a;--r-bg:#fdecee;--r-tx:#df3f45;--p-bg:#f0e9fe;--p-tx:#6d3fd1}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c2e;--tx:#eceef8;--mut:#9aa0b8;--pri:#6b8cff;--pri-d:#8aa4ff;--soft:#1f2850;--bd:#2a2f47;--sh:none;
  --ok-bg:#12341f;--ok-tx:#6fdc9b;--wr-bg:#3a2b0e;--wr-tx:#f2c36b;--bd-bg:#3b1a1d;--bd-tx:#ff9aa0;--g-bg:#12341f;--g-tx:#6fdc9b;--o-bg:#3a2b0e;--o-tx:#f2c36b;--r-bg:#3b1a1d;--r-tx:#ff9aa0;--p-bg:#2b2150;--p-tx:#b9a1ff}}
body{background:var(--bg);color:var(--tx);font-family:Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{color:var(--tx);text-shadow:none;letter-spacing:0}
h2,.row.sp>h2{font-weight:700;font-size:20px;background:none;border:0;padding:0;border-radius:0;box-shadow:none;margin:6px 0 12px;color:var(--tx)}
h3{font-weight:700}
a{color:var(--pri)}

/* ---- Header ---- */
header{background:var(--card);color:var(--tx);border-bottom:1px solid var(--bd);min-height:var(--hh);padding:10px 20px;justify-content:flex-start;gap:12px;box-shadow:none}
header .logo{color:var(--pri);font-weight:800}
.htxt{display:flex;flex-direction:column;min-width:0;flex:1}
#hsub{display:none;color:var(--mut);font-size:16px;font-weight:400;line-height:1.3}
.htitle{display:block;font-size:18px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.hact{display:flex;align-items:center;gap:10px;flex:none}
.hact button{width:42px;height:42px;border-radius:50%;border:0;background:var(--soft);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.hact button.pri{background:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(31,79,216,.32)}
.hact .i{width:22px;height:22px;stroke-width:1.9}
.burger{display:none}
.who{color:var(--mut)}
.who .btn{color:var(--pri);border:1px solid var(--bd);background:var(--card);padding:6px 12px;font-size:13px}

/* ---- Thẻ, nút, nhãn ---- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:14px}
.btn{background:var(--pri);color:#fff;border-radius:12px;padding:10px 16px;font-weight:500;font-family:inherit;box-shadow:none;min-height:40px}
.btn:not(.gh):not(.dg){background:var(--pri);box-shadow:none}
.btn:not(.gh):not(.dg):active{background:var(--pri-d)}
.btn.gh{background:var(--card);color:var(--pri);border:1px solid var(--bd)}
.btn.dg{background:var(--card);color:var(--bad);border:1px solid var(--bd)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:34px;border-radius:10px}
.badge{border-radius:99px;padding:3px 11px;font-size:12px;font-weight:500;background:var(--soft);color:var(--pri)}
.badge.ok{background:var(--ok-bg);color:var(--ok-tx)}.badge.wr{background:var(--wr-bg);color:var(--wr-tx)}.badge.bd{background:var(--bd-bg);color:var(--bd-tx)}
.badge.mu{background:var(--bd);color:var(--mut)}
.vendor-badge{background:var(--soft);color:var(--pri)}.vendor-missing{background:var(--wr-bg);color:var(--wr-tx)}
.mut{color:var(--mut)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px;background:var(--card)}
.module-search input{background:var(--card);border-radius:16px;box-shadow:var(--sh)}
.row.sp{gap:10px}
.empty{background:var(--card);border:1px dashed var(--bd);border-radius:var(--r);padding:34px 16px}
.stage{border-radius:16px;background:var(--card)}
.stage.on{background:var(--soft);border-color:var(--pri);color:var(--pri)}.stage.on .stage-n{color:var(--pri)}
.stage.cancel.on{background:var(--r-bg);border-color:var(--bad);color:var(--bd-tx)}
.quote-calc{background:var(--soft);border-color:transparent}
.quote-calc .tot{border-top:1px solid var(--bd);color:var(--pri)}
.bars i{background:var(--pri);opacity:.85}
.pth{border-radius:14px}
.supplier-report-row{padding:12px 0;border-top:1px solid var(--bd)}
.supplier-report-metrics{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut);font-size:13px;margin-top:4px}
.bigic{color:var(--pri)}

/* ---- Menu trái (máy tính) / ngăn kéo ---- */
nav#nav{background:var(--card);border-right:1px solid var(--bd);box-shadow:none}
.nav-group{border-top:1px solid var(--bd);color:var(--mut)}
.navi{border-radius:16px;color:var(--tx);font-weight:500}
.navi .ni{background:var(--soft);color:var(--pri);border:0;border-radius:12px}
.navi.on{background:var(--soft);border-color:transparent;color:var(--pri);font-weight:700}
.navi.on .ni{background:var(--pri);color:#fff;border:0;box-shadow:none}
.navi .count{background:var(--soft);color:var(--pri)}

.module-search{margin-bottom:12px}
.module-search input{height:48px;padding:0 44px 0 44px}
.module-search .search-ic{top:24px}
.module-search button{top:24px}
.module-search .search-help{font-size:12px}
/* ---- Cửa sổ nhập liệu ---- */
.ov{background:rgba(15,18,40,.5);backdrop-filter:blur(2px)}
.md{border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(15,18,40,.18)}
.md>h3:first-child{font-size:19px;margin-bottom:6px}
@media(min-width:700px){.md{border-radius:24px}}
.it{padding:12px;margin-top:10px;background:var(--bg);border:1px solid var(--bd);border-radius:16px}
.it input,.it select{background:var(--card)}
.it .x{width:34px;height:34px;border-radius:10px;background:var(--r-bg);color:var(--bad);font-size:18px;line-height:1;padding:0}

/* ---- Trang Tổng quan ---- */
.shopchip{display:flex;align-items:center;gap:10px;border:1.5px solid var(--pri);background:var(--soft);color:var(--pri);border-radius:16px;padding:13px 16px;font-weight:700;font-size:16px;margin:4px 0 16px}
.shopchip .i{width:24px;height:24px;stroke-width:1.7}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:6px}
@media(min-width:900px){.kgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kcard{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:14px;text-align:left;width:100%;font:inherit;color:var(--tx);cursor:pointer;margin:0;min-height:116px;padding:16px}
.ktop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.klabel{color:var(--mut);font-size:15px;line-height:1.3}
.kic{width:42px;height:42px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--soft);color:var(--pri)}
.kic .i{width:22px;height:22px;stroke-width:1.9}
.kic.g{background:var(--g-bg);color:var(--g-tx)}.kic.o{background:var(--o-bg);color:var(--o-tx)}.kic.r{background:var(--r-bg);color:var(--r-tx)}.kic.p{background:var(--p-bg);color:var(--p-tx)}
.kval{font-size:24px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:4px;line-height:1.15;word-break:break-word}
.kval .i{width:18px;height:18px;color:var(--mut);stroke-width:2}
.ksub{font-size:12px;color:var(--mut);margin-top:-8px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px}
.sec-h h3{margin:0;font-size:19px}
.sec-h .lnk{border:0;background:none;color:var(--pri);font:600 15px Roboto,Arial,sans-serif;cursor:pointer;padding:6px 0}
.job{cursor:pointer;margin-bottom:12px;padding:16px 18px}
.job .jt{display:flex;justify-content:space-between;gap:10px;align-items:center}
.job .jt b{font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .jp{color:var(--pri);font-weight:700;font-size:15px;flex:none}
.job .jm{color:var(--mut);font-size:13px;margin:2px 0 10px}
.pbar{height:9px;border-radius:99px;background:var(--bd);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:16px 18px;cursor:pointer}
.qrow b{font-size:17px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .qs1{min-width:0}
.qrow .badge{flex:none;padding:7px 14px;font-size:14px;font-weight:500}
.badge.st-Nháp{background:var(--bd);color:var(--mut)}

/* ---- Thanh tab dưới (điện thoại) ---- */
#tabbar{display:none}
@media(max-width:560px){
  :root{--hh:0px}
  header{position:static;background:transparent;border:0;padding:calc(16px + env(safe-area-inset-top)) 18px 4px;align-items:center;gap:10px}
  header .logo,.burger{display:none}
  body[data-view=home] #hsub{display:block}
  .htitle{font-size:27px;font-weight:800;letter-spacing:-.4px;white-space:normal;overflow:visible;line-height:1.15}
  .hact{gap:8px}
  .hact button{width:48px;height:48px}
  .who{display:none}
  main{padding:10px 16px calc(96px + env(safe-area-inset-bottom))}
  #app>.row.sp>h2,#app>.row.sp>div>h2{display:none}
  #app>.row.sp{justify-content:flex-end;margin-bottom:12px}
  #app>.row.sp>div:not(.row){flex:1 1 100%;order:2}
  #app>.row.sp>.btn,#app>.row.sp>.row{order:1;margin-left:auto}
  .card{padding:16px;border-radius:20px}
  .btn{min-height:42px}.btn.sm{min-height:36px}
  input,select,textarea{font-size:16px}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom))}
  #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--card);border-top:1px solid var(--bd);padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(30,40,100,.07)}
  #tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--mut);font:500 12px/1.2 Roboto,Arial,sans-serif;padding:6px 2px;cursor:pointer;border-radius:12px}
  #tabbar .i{width:25px;height:25px;stroke-width:1.7}
  #tabbar button.on{color:var(--pri);font-weight:700}
  #tabbar button.on .i{stroke-width:2.1}
  #tabbar span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  body.nav-open #tabbar{visibility:hidden}
  .kval{font-size:22px}
  .klabel{font-size:14px}
  .job .jt b,.qrow b{font-size:16px}
  /* dòng hàng trong form: tên → số lượng / đơn giá / ĐVT */
  .it{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr) 38px;gap:8px}
  .it .p{grid-column:1/4;grid-row:1}
  .it .x{grid-column:4;grid-row:1;justify-self:end}
  .it .n{grid-column:1/-1;grid-row:2}
  .it .q{grid-column:1;grid-row:3}
  .it .pr{grid-column:2;grid-row:3}
  .it .u{grid-column:3;grid-row:3}
  .it .q,.it .pr,.it .u{min-width:0}
  .md{max-height:94vh}
  .row.end .btn{flex:1}
  .stage{min-width:88px}
  .module-search .search-help{display:none}
}
body[data-view=home] .module-search{display:none}
@media(max-width:380px){.kcard{padding:13px}.kval{font-size:20px}.hact button{width:44px;height:44px}.htitle{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.burger,header .burger{display:none}

/* ===== Menu gọn: mục nhỏ hơn, khoảng cách chặt hơn ===== */
nav#nav{width:236px;gap:1px;padding:10px 8px calc(12px + env(safe-area-inset-bottom))}
@media(min-width:561px){main{margin-left:236px}}
.nav-group{margin:10px 8px 3px;padding-top:9px;font-size:10.5px;letter-spacing:.5px}
.nav-group:first-child{margin-top:2px;padding-top:0;border-top:0}
.navi{min-height:38px;gap:10px;padding:5px 8px;border-radius:10px;font-size:14px;line-height:1.25}
.navi .ni{width:28px;height:28px;border-radius:8px}
.navi .ni .i{width:16px;height:16px;stroke-width:1.9}
.navi .count{min-width:20px;padding:1px 6px;font-size:11px}
.navi:not(.on):hover{background:var(--soft)}
.navi>span:not(.count){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-head{padding:0 8px 8px;font-size:15px}
@media(max-width:560px){
  nav#nav{width:min(78vw,272px);padding:calc(10px + env(safe-area-inset-top)) 8px calc(12px + env(safe-area-inset-bottom))}
  .navi{min-height:40px}
}

/* ===== Bộ lọc nhanh (chip) ===== */
.fbar{display:flex;align-items:center;gap:6px;overflow-x:auto;margin:0 0 12px;padding:2px 1px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fbar::-webkit-scrollbar{display:none}
.fbar>.i{color:var(--mut);width:16px;height:16px;flex:none;margin-right:2px}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:500 13px/1 Roboto,Arial,sans-serif;cursor:pointer;white-space:nowrap}
.fchip i{font-style:normal;font-size:11px;font-weight:700;min-width:18px;padding:2px 5px;border-radius:99px;text-align:center;background:var(--soft);color:var(--pri)}
.fchip:hover{border-color:var(--pri)}
.fchip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.fchip.on i{background:#ffffff2e;color:#fff}

/* ===== Logo iDecal ===== */
.logo img.brand{width:30px;height:30px;border-radius:50%;display:block;flex:none;background:#fff}
.brand-sm{width:26px;height:26px;border-radius:50%;flex:none}
.bigic .brand-lg{width:84px;height:84px;border-radius:50%;display:block;margin:0 auto 6px}
</style>
</head>

function initCloud(){
  if(typeof firebase==='undefined'){session='error';authMsg='Không tải được Firebase (mất mạng hoặc bị chặn). Hãy kiểm tra kết nối rồi tải lại trang.';render();return}
  if(!String(CFG.ownerEmail||'').trim()){session='error';authMsg='Chưa điền ownerEmail (Gmail của chủ cửa hàng) trong file config.js.';render();return}
  try{firebase.initializeApp(FB);auth=firebase.auth();fs=firebase.firestore()}
  catch(e){session='error';authMsg='Cấu hình Firebase không đúng: '+e.message;render();return}
  auth.getRedirectResult().catch(authErr);
  auth.onAuthStateChanged(onUser);
}
function authErr(e){
  const m={'auth/unauthorized-domain':'Tên miền này chưa được thêm vào Firebase (Authentication → Settings → Authorized domains).','auth/popup-closed-by-user':'','auth/cancelled-popup-request':'','auth/network-request-failed':'Mất kết nối mạng.','auth/operation-not-allowed':'Chưa bật đăng nhập Google trong Firebase (Authentication → Sign-in method).'};
  authMsg=m[e.code]!==undefined?m[e.code]:'Lỗi đăng nhập: '+(e.message||e.code);render();
}
function login(){
  authMsg='';const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(p).catch(e=>{if(e.code==='auth/popup-blocked')return auth.signInWithRedirect(p);authErr(e)});
}
function onUser(u){
  if(unUser){unUser();unUser=null}
  stopSync();me=null;
  if(!u){session='out';render();return}
  session='loading';render();
  const ref=fs.collection('users').doc(u.uid);
  ref.get().then(snap=>{
    if(snap.exists)return;
    const mail=(u.email||'').toLowerCase();
    return ref.set({email:mail,name:u.displayName||mail,photo:u.photoURL||'',role:mail===String(CFG.ownerEmail).trim().toLowerCase()?'owner':'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  }).then(()=>{
    unUser=ref.onSnapshot(s=>{
      const d=s.data();
      if(!d){if(auth.currentUser)setTimeout(()=>onUser(auth.currentUser),0);return}
      const prev=me&&me.role;me={uid:u.uid,...d};
      if(['owner','manager','staff'].includes(d.role)){
        if(prev&&prev!==d.role)stopSync();
        session=ready?'ready':'loading';startSync();
      }else{stopSync();session=d.role==='blocked'?'blocked':'pending'}
      render();
    },e=>{session='error';authMsg='Không đọc được hồ sơ tài khoản: '+e.message;render()});
  }).catch(e=>{session='error';authMsg=(e.code==='permission-denied'?'Quy tắc bảo mật (Firestore Rules) chưa được cài hoặc chưa đúng. Xem README. ':'')+e.message;render()});
}
function sub(q,fn,key){
  need++;
  unsubs.push(q.onSnapshot(s=>{fn(s);loaded[key]=true;checkReady()},e=>{session='error';authMsg='Không đọc được dữ liệu "'+key+'": '+e.message;render()}));
}
function startSync(){
  if(unsubs.length)return;
  need=0;loaded={};synced={counters:JSON.stringify({seq:0,qseq:0,pseq:0}),shop:'{}',suppliers:'[]'};
  COLS.filter(c=>isMgr()||!MGR_COLS.includes(c)).forEach(c=>sub(fs.collection(c),s=>{
    db[c]=s.docs.map(d=>d.data());
    synced[c]=Object.fromEntries(db[c].map(x=>[x.id,JSON.stringify(x)]));
  },c));
  sub(fs.collection('meta'),s=>{s.docs.forEach(d=>{
    if(d.id==='counters'){const v=d.data();db.seq=v.seq||0;db.qseq=v.qseq||0;db.pseq=v.pseq||0;synced.counters=JSON.stringify(cntObj())}
    if(d.id==='shop'){db.shop=d.data();synced.shop=JSON.stringify(db.shop)}
    if(d.id==='suppliers'){db.suppliers=d.data().items||[];synced.suppliers=JSON.stringify(db.suppliers)}
  })},'meta');
  if(isOwner())sub(fs.collection('users'),s=>{usersList=s.docs.map(d=>({uid:d.id,...d.data()}))},'users');
}
function stopSync(){unsubs.forEach(f=>f());unsubs=[];loaded={};need=0;ready=false;synced={};db=blank()}
function checkReady(){if(!ready&&Object.keys(loaded).length>=need){ready=true;session='ready'}render()}
function cloudSave(){
  if(!ready)return;
  const ops=[],strip=x=>JSON.parse(JSON.stringify(x));
  for(const c of COLS){
    if(!loaded[c])continue;
    const old=synced[c]||(synced[c]={}),cur=new Set();
    for(const x of db[c]){cur.add(x.id);const j=JSON.stringify(x);if(old[x.id]!==j){old[x.id]=j;ops.push(['set',fs.collection(c).doc(x.id),strip(x)])}}
    for(const id of Object.keys(old))if(!cur.has(id)){delete old[id];ops.push(['del',fs.collection(c).doc(id)])}
  }
  const cj=JSON.stringify(cntObj());
  if(synced.counters!==cj){synced.counters=cj;ops.push(['set',fs.collection('meta').doc('counters'),cntObj()])}
  const sj=JSON.stringify(db.shop||{});
  if(isMgr()&&synced.shop!==sj){synced.shop=sj;ops.push(['set',fs.collection('meta').doc('shop'),strip(db.shop||{})])}
  const suj=JSON.stringify(db.suppliers||[]);
  if(isMgr()&&synced.suppliers!==suj){synced.suppliers=suj;ops.push(['set',fs.collection('meta').doc('suppliers'),{items:strip(db.suppliers||[])}])}
  for(let i=0;i<ops.length;i+=400){
    const b=fs.batch();
    ops.slice(i,i+400).forEach(o=>o[0]==='set'?b.set(o[1],o[2]):b.delete(o[1]));
    b.commit().catch(e=>toast(e.code==='permission-denied'?'Bạn không có quyền thực hiện thao tác này':'Không lưu được: '+e.message,'err'));
  }
}

function supplierChoices(){
  db.suppliers=db.suppliers||[];
  const choices=db.suppliers.map(s=>({...s}));

  const legacyNames=[...(db.purchases||[]).map(p=>p.supplier),...(db.orders||[]).map(o=>o.supplierName)];
  for(const raw of legacyNames){
    const name=String(raw||'').trim(),key=name.toLocaleLowerCase('vi');

    seen.add(key);choices.push({id:'legacy-'+name,name,legacy:true});

  return choices.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'vi'));

function normImg(u){ // '' = trống, null = không hợp lệ, còn lại = link dùng được
  u=(u||'').trim();if(!u)return'';
  const g=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  if(g)return'https://drive.google.com/thumbnail?id='+g[1]+'&sz=w800';
  return/^https?:\/\/\S+$/i.test(u)?u:null;
}
function fileToThumb(file,max=480){ // thu nhỏ + nén JPEG để nhẹ (lưu thẳng trong dữ liệu sản phẩm)
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type||'image/'))return rej(new Error('Đây không phải file ảnh'));
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      let out=c.toDataURL('image/jpeg',.72);if(out.length>150000)out=c.toDataURL('image/jpeg',.55);
      res(out);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Không đọc được ảnh này. Hãy thử file JPG hoặc PNG.'))};
    im.src=url;
  });
}

function orderMaterials(o){

function fileToLogo(file,max=360){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type||'image/'))return rej(new Error('Đây không phải file ảnh'));
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      let out=c.toDataURL('image/png');   // giữ nền trong suốt cho logo
      if(out.length>160000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);out=c.toDataURL('image/jpeg',.8)}
      res(out);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Không đọc được ảnh này. Hãy thử file JPG hoặc PNG.'))};
    im.src=url;
  });
}

function purchaseForm(id, presetOrderId=''){

      <label>Chọn nhà cung cấp<select name="supplierSelect" id="supplierSelect"><option value="">— Chọn NCC —</option>${sups.map(s=>`<option value="${esc(s.id)}" ${known&&known.id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}<option value="__new__" ${!known&&!retail?'selected':''}>＋ Nhập NCC mới…</option></select></label>
      <div id="newSupplierWrap" style="${!known&&!retail?'':'display:none'}">
        ${fld('Tên nhà cung cấp mới','supplierNew',!known&&!retail&&o.supplier!=='Khách lẻ'?o.supplier:'','text','')}
        ${fld('Số điện thoại','supplierPhone',o.supplierInfo?.phone||'','tel')}
        ${fld('Email','supplierEmail',o.supplierInfo?.email||'','email')}
        ${fld('Mã số thuế','supplierTax',o.supplierInfo?.taxCode||'')}
        <label>Địa chỉ<textarea name="supplierAddress" rows="2">${esc(o.supplierInfo?.address||'')}</textarea></label>
        <label>Người liên hệ<input name="supplierContact" value="${esc(o.supplierInfo?.contact||'')}"></label>
      </div>
    </div>
    ${fld('Ngày','date',o.date,'date','required')}
    <label>Đơn hàng liên quan <select name="orderId"><option value="">— Chi phí chung / chưa gắn đơn —</option>${db.orders.filter(x=>x.status!=='Huỷ'&&(!x.archived||x.id===o.orderId)).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<option value="${x.id}" ${(o.orderId||'')===x.id?'selected':''}>${esc(x.code)} · ${esc(orderCustomerName(x))}</option>`).join('')}</select></label>
    <div class="mut">Chọn đơn hàng nếu đây là tiền xưởng in/gia công hoặc vật tư dùng riêng cho đơn đó. Mỗi khoản chỉ nhập một lần.</div>
    <label>Dịch vụ / hàng mua</label><div id="items"></div>
    <button type="button" class="btn gh sm" id="addI" style="margin-top:8px">${ic('plus')} Thêm dòng</button>
    <label class="chk"><input type="checkbox" name="paid" ${o.paid?'checked':''}> Đã thanh toán</label>
    ${fld('Ghi chú','note',o.note||'')}
    <div class="tot">Tổng: <b id="tot">0đ</b></div>`,
  (fd,m)=>{
    const items=readItems(m).map(i=>({pid:i.pid,name:i.name,qty:i.qty,cost:i.price}));
    if(!items.length){alert('Cần ít nhất 1 dòng hàng hợp lệ');return false}
    const sourceType=fd.get('sourceType')||'supplier';
    let supplier='Khách lẻ',supplierId='',supplierInfo=null;
    if(sourceType!=='retail'){
      const sid=String(fd.get('supplierSelect')||'');
      if(sid==='__new__'){
        supplier=String(fd.get('supplierNew')||'').trim();
        if(!supplier){alert('Vui lòng nhập tên nhà cung cấp.');return false}
        supplierInfo={name:supplier,phone:String(fd.get('supplierPhone')||'').trim(),email:String(fd.get('supplierEmail')||'').trim(),taxCode:String(fd.get('supplierTax')||'').trim(),address:String(fd.get('supplierAddress')||'').trim(),contact:String(fd.get('supplierContact')||'').trim(),note:''};
        let saved=(db.suppliers||[]).find(x=>x.name.toLowerCase()===supplier.toLowerCase());
        if(!saved){saved={id:uid(),...supplierInfo};(db.suppliers||(db.suppliers=[])).push(saved)}else Object.assign(saved,supplierInfo);
        supplierId=saved.id;
      }else{
        const saved=(db.suppliers||[]).find(x=>x.id===sid)||sups.find(x=>x.id===sid);
        if(!saved){alert('Vui lòng chọn nhà cung cấp hoặc nhập NCC mới.');return false}
        supplier=saved.name;supplierId=saved.id.startsWith('legacy-')?'':saved.id;supplierInfo={name:saved.name,address:saved.address||'',phone:saved.phone||'',email:saved.email||'',taxCode:saved.taxCode||'',contact:saved.contact||''};
      }
    }
    const data={supplier,supplierId,supplierInfo,sourceType,date:fd.get('date'),orderId:fd.get('orderId')||'',paid:fd.get('paid')==='on',note:fd.get('note'),items};
    if(id)Object.assign(o,data);else db.purchases.push({id:uid(),code:'MH'+String(++db.pseq).padStart(4,'0'),...data});
    const linkedOrder=db.orders.find(x=>x.id===data.orderId);

  sourceTypeEl.addEventListener('change',syncSupplierFields);supplierSelectEl.addEventListener('change',syncSupplierFields);syncSupplierFields();
  itemEditor(m,o.items.map(i=>({...i,price:i.cost})));
  m.querySelectorAll('.pr').forEach(x=>x.placeholder='Giá nhập');

}

  const mon=db.purchases.filter(p=>p.date.startsWith(mk)).reduce((s,p)=>s+ptotal(p),0);
  const debt=db.purchases.filter(p=>!p.paid).reduce((s,p)=>s+ptotal(p),0);
  return`<div class="row sp"><div><h2>Mua hàng</h2><div class="mut">Ghi tiền xưởng in/gia công, vật tư và công nợ NCC. Chọn mã đơn để tự cộng vào báo cáo lãi lỗ.</div></div><button class="btn" data-a="newPurchase">${ic('plus')} Phiếu mua</button></div>
  <div class="grid"><div class="card kpi"><small>Mua tháng này</small><b>${vnd(mon)}</b></div><div class="card kpi"><small>Nợ nhà cung cấp</small><b class="${debt?'neg':''}">${vnd(debt)}</b></div></div>
  ${fbar('purchases',all)}
  ${list.length?list.map(p=>`<div class="card">
    <div class="row sp"><b>${p.code} · ${esc(p.supplier)}</b><b>${vnd(ptotal(p))}</b></div>

function expensesView(){
  const mk=today().slice(0,7),expenses=[...db.expenses].sort((a,b)=>b.date.localeCompare(a.date));
  const AS=archIds(),vis=expenses.filter(e=>!AS.has(e.orderId));
  const expMon=expenses.filter(e=>e.date.startsWith(mk)).reduce((s,e)=>s+(+e.amount||0),0);
  return`<div class="row sp"><div><h2>Chi phí</h2><div class="mut">Ghi nhận chi phí phát sinh và gắn vào đơn hàng để tính lãi lỗ.</div></div><button class="btn" data-a="newExp">${ic('plus')} Chi phí mới</button></div>
    <div class="grid"><div class="card kpi"><small>Chi phí tháng này</small><b>${vnd(expMon)}</b></div><div class="card kpi"><small>Tổng chi phí</small><b>${vnd(expenses.reduce((s,e)=>s+(+e.amount||0),0))}</b></div></div>
    ${fbar('exp',vis)}
    ${fapply('exp',vis).length?fapply('exp',vis).map(e=>`<div class="card row sp"><div><b>${esc(e.cat)}</b> <span class="mut">${e.date}</span><div class="mut">${esc(e.note||'')} ${e.orderId?`<span class="badge ok">${esc((db.orders.find(o=>o.id===e.orderId)||{}).code||'Đơn đã xoá')}</span>`:'<span class="badge">Chưa gắn đơn</span>'}</div></div><div class="row"><b>${vnd(e.amount)}</b><button class="btn dg sm" data-a="delExp" data-id="${e.id}">×</button></div></div>`).join(''):emp(vis.length,'Chưa có chi phí')}`;

function orderRevenue(o){
  // VAT is a pass-through amount, not operating revenue; the quote conversion stores it as a line item.
  return (o.items||[]).reduce((sum,i)=>sum+(/^VAT\s/i.test(String(i.name||''))?0:lineAmt(i)),0);
}
function orderActualCosts(o){
  const buys=(db.purchases||[]).filter(p=>p.orderId===o.id).reduce((sum,p)=>sum+ptotal(p),0);
  const ex=(db.expenses||[]).filter(e=>e.orderId===o.id).reduce((sum,e)=>sum+(+e.amount||0),0);
  return buys+ex;
}
function orderCostBreakdown(o){
  const purchases=(db.purchases||[]).filter(p=>p.orderId===o.id);
  const expenses=(db.expenses||[]).filter(e=>e.orderId===o.id);
  return {buys:purchases.reduce((s,p)=>s+ptotal(p),0),exp:expenses.reduce((s,e)=>s+(+e.amount||0),0),count:purchases.length+expenses.length};
}
function profitView(){
  const active=db.orders.filter(o=>valid(o)).sort((a,b)=>b.date.localeCompare(a.date)||b.code.localeCompare(a.code));
  const shown=active.filter(o=>!o.archived);
  const rev=active.reduce((s,o)=>s+orderRevenue(o),0),actual=active.reduce((s,o)=>s+orderActualCosts(o),0),estimated=active.reduce((s,o)=>s+cogs(o),0);
  const supplierGroups=new Map();
  active.forEach(o=>{
    const name=orderSupplierName(o)||'Chưa gắn NCC';
    if(!supplierGroups.has(name))supplierGroups.set(name,{name,orders:0,revenue:0,buys:0,expenses:0,profit:0});
    const g=supplierGroups.get(name),bd=orderCostBreakdown(o);
    g.orders++;g.revenue+=orderRevenue(o);g.buys+=bd.buys;g.expenses+=bd.exp;g.profit+=orderRevenue(o)-bd.buys-bd.exp;
  });
  const bySupplier=[...supplierGroups.values()].sort((a,b)=>a.name==='Chưa gắn NCC'?1:b.name==='Chưa gắn NCC'?-1:a.name.localeCompare(b.name,'vi'));
  return `<div class="row sp"><div><h2>Lãi lỗ đơn hàng</h2><div class="mut">Tổng hợp doanh thu trước VAT, NCC/xưởng chính, tiền mua hàng và chi phí đã gắn mã đơn.</div></div></div>
  <div class="grid"><div class="card kpi"><small>Doanh thu trước VAT</small><b>${vnd(rev)}</b></div><div class="card kpi"><small>Chi phí đã gắn đơn</small><b>${vnd(actual)}</b></div><div class="card kpi"><small>Chênh lệch sau khoản chi đã ghi nhận</small><b class="${rev-actual<0?'neg':'pos'}">${vnd(rev-actual)}</b></div><div class="card kpi"><small>Giá vốn tham khảo từ sản phẩm</small><b>${vnd(estimated)}</b></div></div>
  <div class="card"><b>Cách đọc số liệu</b><p class="mut">“Chênh lệch sau chi phí đã ghi nhận” = doanh thu trước VAT − phiếu mua hàng gắn đơn − chi phí gắn đơn. Đây chưa phải lợi nhuận cuối cùng nếu còn thiếu hóa đơn xưởng, giao hàng hoặc phí khác. Những đơn chưa có giao dịch chi phí sẽ được ghi rõ là chưa đủ dữ liệu.</p><p class="mut">“Giá vốn tham khảo” lấy từ trường giá vốn trong danh mục sản phẩm để so sánh nhanh; không cộng vào chi phí thực tế nhằm tránh tính trùng với tiền xưởng đã ghi ở Mua hàng. Báo cáo theo NCC nhóm doanh thu/lãi của đơn theo NCC chính đã chọn; mọi phiếu mua gắn với đơn vẫn được cộng vào chi phí của đơn để không bỏ sót nhà cung cấp phụ.</p></div>
  <div class="card supplier-report"><div class="row sp"><b>Lãi lỗ theo nhà cung cấp chính</b><span class="mut">${bySupplier.length} nhóm</span></div>
  ${bySupplier.length?bySupplier.map(g=>`<div class="supplier-report-row"><div class="row sp"><b>${esc(g.name)}</b><span class="badge ${g.profit<0?'bd':'ok'}">${vnd(g.profit)}</span></div><div class="supplier-report-metrics"><span>${g.orders} đơn</span><span>Doanh thu ${vnd(g.revenue)}</span><span>Mua hàng/xưởng ${vnd(g.buys)}</span><span>Chi phí khác ${vnd(g.expenses)}</span></div></div>`).join(''):'<div class="empty">Chưa có dữ liệu</div>'}</div>
  ${fbar('profit',shown)}
  ${fapply('profit',shown).length?fapply('profit',shown).map(o=>{const rev=orderRevenue(o),bd=orderCostBreakdown(o),profit=rev-bd.buys-bd.exp,est=cogs(o),custName=orderCustomerName(o),supplierName=orderSupplierName(o);return `<div class="card"><div class="row sp"><div><b>${esc(o.code)} · ${esc(custName)}</b><div class="mut">${esc(o.date)} · ${esc(o.status||'Mới')}</div><div style="margin-top:5px">${supplierName?`<span class="badge vendor-badge">${ic('store')} NCC chính: ${esc(supplierName)}</span>`:'<span class="badge vendor-missing">Chưa gắn NCC chính</span>'}</div></div><span class="badge ${profit<0?'bd':bd.count?'ok':'wr'}">${bd.count?'Đã ghi '+bd.count+' khoản':'Chưa ghi chi phí'}</span></div><div class="grid" style="margin-top:10px"><div><small class="mut">Doanh thu trước VAT</small><div><b>${vnd(rev)}</b></div></div><div><small class="mut">Mua hàng / xưởng</small><div><b>${vnd(bd.buys)}</b></div></div><div><small class="mut">Chi phí khác</small><div><b>${vnd(bd.exp)}</b></div></div><div><small class="mut">Lãi theo khoản đã ghi</small><div><b class="${bd.count===0?'mut':profit<0?'neg':'pos'}">${bd.count===0?'Chưa đủ dữ liệu':vnd(profit)}</b></div></div></div><div class="mut" style="margin-top:8px">Giá vốn tham khảo trong danh mục: ${vnd(est)} · ${bd.count?'Đã ghi '+bd.count+' giao dịch liên quan':'Chưa có giao dịch mua hàng/chi phí gắn với đơn này'}.</div><div class="row" style="margin-top:8px"><button class="btn gh sm" data-a="newPurchaseForOrder" data-id="${o.id}">＋ Ghi tiền xưởng</button><button class="btn gh sm" data-a="newExpForOrder" data-id="${o.id}">＋ Ghi chi phí</button><button class="btn gh sm" data-a="editOrder" data-id="${o.id}">Xem / sửa đơn</button></div></div>`}).join(''):'<div class="empty">Chưa có đơn hàng để tính lãi lỗ.</div>'}`;
}

/* ---------- Lưu trữ đơn hàng ---------- */
const DONE_ST=['Hoàn thành','Đã giao'];
const archIds=()=>new Set(db.orders.filter(o=>o.archived).map(o=>o.id));
function orderLinks(ids){
  const S=new Set(ids);
  return{q:db.quotes.filter(x=>S.has(x.orderId)).length,p:db.purchases.filter(x=>S.has(x.orderId)).length,e:db.expenses.filter(x=>S.has(x.orderId)).length,
    d:db.orders.filter(o=>S.has(o.id)).reduce((n,o)=>n+(o.deposits||[]).length,0)};
}
function purgeOrders(ids){
  if(!isMgr()){toast('Chỉ quản lý mới được xoá vĩnh viễn','err');return}
  ids=ids.filter(id=>db.orders.some(o=>o.id===id));if(!ids.length)return;
  const k=orderLinks(ids),one=ids.length===1?db.orders.find(o=>o.id===ids[0]):null;
  const msg=(one?'Xoá vĩnh viễn đơn '+one.code+'?':'Xoá vĩnh viễn '+ids.length+' đơn?')+'\n\nSẽ xoá luôn dữ liệu gắn với '+(one?'đơn này':'các đơn này')+':\n• '+k.d+' khoản tạm ứng\n• '+k.q+' báo giá\n• '+k.p+' phiếu mua hàng\n• '+k.e+' khoản chi phí\n\nKhông thể hoàn tác.';
  if(!confirm(msg))return;
  const S=new Set(ids);
  db.quotes=db.quotes.filter(x=>!S.has(x.orderId));
  db.purchases=db.purchases.filter(x=>!S.has(x.orderId));
  db.expenses=db.expenses.filter(x=>!S.has(x.orderId));
  db.orders=db.orders.filter(o=>!S.has(o.id));
  save();render();toast('Đã xoá '+ids.length+' đơn và dữ liệu liên quan','ok');
}
function archiveData(){
  const AR=db.orders.filter(o=>o.archived).sort((a,b)=>String(b.archivedAt||b.date).localeCompare(String(a.archivedAt||a.date))||b.code.localeCompare(a.code));
  return{AR,list:fapply('archive',AR)};
}

  const{AR,list}=archiveData();

  <div class="grid"><div class="card kpi"><small>Đơn đã lưu trữ</small><b>${AR.length}</b></div><div class="card kpi"><small>Doanh thu trước VAT</small><b>${vnd(revenue)}</b></div></div>
  ${fbar('archive',AR)}
  ${list.length?list.map(o=>{const k=orderLinks([o.id]);return`<div class="card">
    <div class="row sp"><b>${esc(o.code)} · ${esc(orderCustomerName(o))}</b><b>${vnd(total(o))}</b></div>
    <div class="mut">${esc(o.date||'')} · ${esc(o.status||'')}${o.archivedAt?' · lưu trữ '+esc(o.archivedAt):''}</div>
    <div class="row" style="gap:6px;margin-top:6px"><span class="badge ${o.paid?'ok':'wr'}">${o.paid?'Đã thu':'Chưa thu'}</span><span class="mut">${k.d} tạm ứng · ${k.q} báo giá · ${k.p} phiếu mua · ${k.e} chi phí</span></div>
    <div class="row" style="margin-top:8px"><button class="btn gh sm" data-a="previewOrder" data-id="${o.id}">👁 Xem</button><button class="btn gh sm" data-a="unarchiveOrder" data-id="${o.id}">${ic('undo')} Khôi phục</button>${isMgr()?`<button class="btn dg sm" data-a="delOrder" data-id="${o.id}">${ic('trash')} Xoá vĩnh viễn</button>`:''}</div></div>`}).join(''):emp(AR.length,'Chưa có đơn nào trong lưu trữ')}`;
}

/* ---------- Bộ lọc dùng chung cho các module ---------- */
const VF={};
const thisMonth=d=>String(d||'').startsWith(today().slice(0,7));
const custDue=c=>db.orders.filter(o=>o.cid===c.id&&valid(o)).reduce((t,o)=>t+orderDue(o),0);
const custOrders=c=>db.orders.filter(o=>o.cid===c.id&&valid(o)).length;
const SUP_CAT={'in-an':'In ấn','shop-decal':'Shop Decal','film-noi-that':'Film nội thất','film-cach-nhiet':'Film cách nhiệt'};
const FDEF={
  orders:[['all','Tất cả',()=>true],['unpaid','Chưa thu',o=>!o.paid],['paid','Đã thu',o=>!!o.paid],['nosup','Chưa gắn NCC',o=>!orderSupplierName(o)]],
  quote:[['all','Tất cả',()=>true],...QST.map(x=>[x,x,q=>q.status===x]),['conv','Đã thành đơn',q=>db.orders.some(o=>o.id===q.orderId)]],
  cust:[['all','Tất cả',()=>true],['debt','Còn nợ',c=>custDue(c)>0],['has','Đã có đơn',c=>custOrders(c)>0],['none','Chưa có đơn',c=>custOrders(c)===0]],
  deposits:[['all','Tất cả',()=>true],['open','Chưa thu đủ',o=>!o.paid],['done','Đã thu đủ',o=>!!o.paid]],
  prod:[['all','Tất cả',()=>true],['img','Có ảnh',p=>!!p.img],['noimg','Chưa có ảnh',p=>!p.img]],
  purchases:[['all','Tất cả',()=>true],['unpaid','Chưa trả',p=>!p.paid],['paid','Đã trả',p=>!!p.paid],['month','Tháng này',p=>thisMonth(p.date)],['noord','Chưa gắn đơn',p=>!p.orderId]],
  suppliers:[['all','Tất cả',()=>true],...Object.entries(SUP_CAT).map(([k,v])=>[k,v,x=>(x.category||'in-an')===k])],
  exp:[['all','Tất cả',()=>true],['month','Tháng này',e=>thisMonth(e.date)],['ord','Đã gắn đơn',e=>!!e.orderId],['noord','Chưa gắn đơn',e=>!e.orderId]],
  profit:[['all','Tất cả',()=>true],['nocost','Chưa ghi chi phí',o=>orderCostBreakdown(o).count===0],['gain','Có lãi',o=>orderCostBreakdown(o).count>0&&orderRevenue(o)-orderActualCosts(o)>=0],['loss','Lỗ',o=>orderCostBreakdown(o).count>0&&orderRevenue(o)-orderActualCosts(o)<0],['nosup','Chưa gắn NCC',o=>!orderSupplierName(o)]],
  archive:[['all','Tất cả',()=>true],['hh','Hoàn thành',o=>o.status==='Hoàn thành'],['dg','Đã giao',o=>o.status==='Đã giao'],['huy','Huỷ',o=>o.status==='Huỷ'],['unpaid','Chưa thu',o=>!o.paid]],
  team:[['all','Tất cả',()=>true],['pending','Chờ duyệt',u=>u.role==='pending'],['staff','Nhân viên',u=>u.role==='staff'],['manager','Quản lý',u=>u.role==='manager'],['blocked','Đã khoá',u=>u.role==='blocked']]
};
const fcur=v=>{const d=FDEF[v]||[];return d.find(x=>x[0]===VF[v])||d[0]};
const fapply=(v,list)=>{const d=fcur(v);return d?list.filter(d[2]):list};
function fbar(v,list){
  const d=FDEF[v];if(!d)return'';const cur=fcur(v)[0];
  return`<div class="fbar" role="group" aria-label="Bộ lọc">${ic('filter')}${d.map(x=>`<button type="button" class="fchip${x[0]===cur?' on':''}" data-a="vf" data-id="${esc(v+'|'+x[0])}" aria-pressed="${x[0]===cur}">${esc(x[1])}<i>${list.filter(x[2]).length}</i></button>`).join('')}</div>`;
}
const emp=(n,txt)=>`<div class="empty">${n?'Không có mục nào khớp bộ lọc':txt}</div>`;
const views={archive:archiveView,home,deposits:depositsView,orders,quote:quotes,cust:custs,prod:prods,purchases:buys,suppliers:suppliersView,exp:expensesView,profit:profitView,more,team};
function whoHTML(){
  if(!CLOUD||!me||session==='out')return'';
  return`<span class="who-txt">${esc(me.name||me.email)} · ${ROLE_NAME[me.role]||''}</span> <button class="btn" data-a="logout">Thoát</button>`;
}
function authView(){
  const box=h=>`<div class="auth card">${h}</div>`;
  if(session==='loading')return box('<div class="empty">Đang tải…</div>');
  if(session==='error')return box(`<div class="bigic neg">${ic('alert')}</div><h2>Có lỗi</h2><p class="mut">${esc(authMsg)}</p><button class="btn" onclick="location.reload()">Tải lại trang</button> <button class="btn gh" data-a="logout">Đăng xuất</button>`);
  if(session==='pending')return box(`<div class="bigic">${ic('clock')}</div><h2>Đang chờ chủ duyệt</h2><p class="mut">Tài khoản <b>${esc(me.email)}</b> đã đăng ký. Khi chủ cửa hàng duyệt và chọn cấp cho bạn, trang này sẽ tự mở vào app.</p><button class="btn gh" data-a="logout">Đăng xuất</button>`);
  if(session==='blocked')return box(`<div class="bigic neg">${ic('ban')}</div><h2>Tài khoản bị khoá</h2><p class="mut">Tài khoản <b>${esc(me.email)}</b> không được phép truy cập. Hãy liên hệ chủ cửa hàng.</p><button class="btn gh" data-a="logout">Đăng xuất</button>`);
  return box(`<div class="bigic">${brand('brand-lg')}</div><h2>iDecal</h2><p class="mut">Đăng nhập hoặc đăng ký bằng Gmail. Lần đầu đăng nhập, tài khoản sẽ chờ chủ cửa hàng duyệt và phân quyền.</p>
  ${authMsg?`<p class="neg">${esc(authMsg)}</p>`:''}
  <button class="btn" data-a="login" style="width:100%;padding:12px">${ic('login')} Đăng nhập / Đăng ký bằng Google</button>
  <p class="mut" style="margin-top:14px;font-size:12px">Nếu mở trong Zalo/Facebook mà không đăng nhập được, hãy mở link bằng Chrome hoặc Safari.</p>`);
}
function searchNorm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().trim()}
function applyModuleSearch(){
  const q=searchNorm(moduleSearch);let shown=0;
  document.querySelectorAll('#app .card').forEach(card=>{const match=!q||searchNorm(card.innerText||card.textContent).includes(q);card.style.display=match?'':'none';if(match)shown++});
  const empty=document.querySelector('#searchNoResults');if(empty)empty.style.display=q&&shown===0?'block':'none';
  document.querySelectorAll('#app .empty').forEach(el=>{el.style.display=q?'none':''});
}
document.addEventListener('input',e=>{if(e.target&&e.target.id==='moduleSearch'){moduleSearch=e.target.value;applyModuleSearch()}});
function navHTML(tabs){
  const sc=statusCounts();let last=null,html='';
  for(const t of tabs){
    if(t.group!==last){html+=t.group?`<div class="nav-group">${esc(t.group)}</div>`:'';last=t.group}
    const on=t.id===view;
    html+=`<button class="navi${on?' on':''}" data-a="tab" data-id="${t.id}"${on?' aria-current="page"':''}><b class="ni ni-${t.color}">${ic(t.icon)}</b><span>${esc(t.label)}</span>${t.badge?`<span class="count" title="CV đang xử lý">${openJobs(sc)}</span>`:''}</button>`;
  }
  return html;
}
function render(){
  $('#who').innerHTML=whoHTML();
  if(CLOUD&&session!=='ready'){$('#nav').innerHTML='';$('#tabbar').innerHTML='';$('#hact').innerHTML='';$('#hsub').textContent='';$('#htitle').textContent='';document.body.dataset.view='auth';$('#app').innerHTML=authView();return}
  const tabs=tabsFor();if(!tabs.some(t=>t.id===view))view='home';
  $('#nav').innerHTML=`<div class="nav-head">${brand('brand-sm')} iDecal</div>`+navHTML(tabs);
  $('#htitle').textContent=view==='home'?'Tổng quan':((tabs.find(t=>t.id===view)||{}).label||'');
  document.body.dataset.view=view;$('#hsub').innerHTML=view==='home'?'Xin chào 👋':'';
  $('#hact').innerHTML=`<button type="button" data-a="tab" data-id="more" aria-label="Cài đặt">${ic('settings')}</button>`+(view==='home'?(isMgr()?`<button type="button" data-a="tab" data-id="profit" aria-label="Lãi lỗ">${ic('barchart')}</button>`:'')+`<button type="button" class="pri" data-a="quickAdd" aria-label="Thêm mới">${ic('plus')}</button>`:'');
  const TB=[['home','Tổng quan','home'],['orders','Đơn hàng','clipboard'],['quote','Báo giá','filetext'],['cust','Khách hàng','users']].filter(x=>tabs.some(t=>t.id===x[0]));
  $('#tabbar').innerHTML=TB.map(x=>`<button type="button" class="${view===x[0]?'on':''}" data-a="tab" data-id="${x[0]}"${view===x[0]?' aria-current="page"':''}>${ic(x[2])}<span>${x[1]}</span></button>`).join('')+`<button type="button" class="${TB.some(x=>x[0]===view)?'':'on'}" data-a="toggleNav" aria-label="Mở menu">${ic('menu')}<span>Menu</span></button>`;
  const searchBar=`<div class="module-search"><span class="search-ic">${ic('search',20)}</span><input id="moduleSearch" type="search" value="${esc(moduleSearch)}" placeholder="Tìm kiếm trong ${esc((tabs.find(t=>t.id===view)||{}).label||'module này')}…" aria-label="Tìm kiếm trong module hiện tại"><button type="button" data-a="clearSearch" title="Xoá tìm kiếm">×</button><div class="search-help">Tìm theo tên, mã, số điện thoại, nội dung hoặc thông tin hiển thị trong module này.</div></div>`;
  $('#app').innerHTML=searchBar+(!CLOUD&&!LS?WARN:'')+views[view]()+`<div class="search-no-results" id="searchNoResults">Không tìm thấy kết quả phù hợp.</div>`;
  applyModuleSearch();
}
const $=s=>document.querySelector(s);

/* ---------- Actions ---------- */
const setNav=open=>{document.body.classList.toggle('nav-open',open);const b=$('#navToggle');if(b)b.setAttribute('aria-expanded',open?'true':'false')};
const acts={
  tab:id=>{view=id;moduleSearch='';setNav(false);render();scrollTo(0,0)},
  quickAdd:()=>{const m={quote:'newQuote',cust:'newCust',purchases:'newPurchase',suppliers:'newSupplier',exp:'newExp',prod:'newProd'};let k=m[view]||'newOrder';if((k==='newProd'||k==='newPurchase'||k==='newSupplier'||k==='newExp')&&!isMgr())k='newOrder';acts[k]()},
  clearSearch:()=>{moduleSearch='';const el=$('#moduleSearch');if(el)el.value='';applyModuleSearch();if(el)el.focus()},
  filter:id=>{filter=id;render()},
  vf:s=>{const i=s.indexOf('|');VF[s.slice(0,i)]=s.slice(i+1);render()},
  newOrder:()=>orderForm(),editOrder:id=>orderForm(id),previewOrder:id=>previewOrder(id),printOrder:id=>printOrder(id),pdfOrder:id=>pdfOrder(id),
  delOrder:id=>purgeOrders([id]),
  archiveOrder:id=>{const o=db.orders.find(x=>x.id===id);if(!o)return;if(!o.paid&&o.status!=='Huỷ'&&!confirm('Đơn '+o.code+' chưa thu đủ tiền. Vẫn chuyển vào Lưu trữ?'))return;o.archived=true;o.archivedAt=today();save();render();toast('Đã chuyển '+o.code+' vào Lưu trữ','ok')},
  unarchiveOrder:id=>{const o=db.orders.find(x=>x.id===id);if(!o)return;delete o.archived;delete o.archivedAt;save();render();toast('Đã khôi phục '+o.code,'ok')},
  archiveDone:()=>{const L=db.orders.filter(o=>!o.archived&&o.paid&&DONE_ST.includes(o.status));if(!L.length)return;if(!confirm('Chuyển '+L.length+' đơn đã hoàn thành và đã thu đủ tiền vào Lưu trữ?'))return;const d=today();L.forEach(o=>{o.archived=true;o.archivedAt=d});save();render();toast('Đã lưu trữ '+L.length+' đơn','ok')},
  purgeArchive:()=>purgeOrders(archiveData().list.map(o=>o.id)),
  newDeposit:id=>depositForm(id),depositOrder:id=>depositForm(id),
  pay:id=>{const o=db.orders.find(x=>x.id===id);o.paid=!o.paid;save();render()},
  newCust:()=>custForm(),editCust:id=>custForm(id),
  delCust:id=>{if(confirm('Xoá khách này? (đơn cũ vẫn giữ)')){db.customers=db.customers.filter(c=>c.id!==id);save();render()}},
  newProd:()=>prodForm(),editProd:id=>prodForm(id),
  delProd:id=>{if(confirm('Xoá sản phẩm này?')){db.products=db.products.filter(p=>p.id!==id);save();render()}},
  newQuote:()=>quoteForm(),editQuote:id=>quoteForm(id),previewQuote:id=>previewQuote(id),printQuote:id=>printQuote(id),pdfQuote:id=>pdfQuote(id),printPurchase:id=>printPurchase(id),pdfPurchase:id=>pdfPurchase(id),shop:()=>shopForm(),tpl:()=>{if(isMgr())tplForm()},
  delQuote:id=>{if(confirm('Xoá báo giá này?')){db.quotes=db.quotes.filter(q=>q.id!==id);save();render()}},
  toggleNav:()=>setNav(!document.body.classList.contains('nav-open')),
  closeNav:()=>setNav(false),
  toOrder:id=>convertQuote(db.quotes.find(x=>x.id===id)),viewOrder:()=>{filter='Tất cả';view='orders';setNav(false);render();scrollTo(0,0)},
  newPurchase:()=>purchaseForm(),editPurchase:id=>purchaseForm(id),newPurchaseForOrder:id=>purchaseForm('',id),newExpForOrder:id=>expForm(id),newSupplier:()=>supplierForm(),editSupplier:id=>supplierForm(id),
  delSupplier:id=>{const supplier=(db.suppliers||[]).find(x=>x.id===id);if(!supplier)return;const linked=(db.orders||[]).filter(o=>o.supplierId===id).length;if(!confirm('Xóa nhà cung cấp “'+supplier.name+'” khỏi danh bạ?'+(linked?' '+linked+' đơn hàng đang liên kết sẽ được bỏ liên kết NCC.':'')+' Phiếu mua hàng cũ vẫn được giữ nguyên.'))return;db.suppliers=db.suppliers.filter(x=>x.id!==id);db.orders.forEach(o=>{if(o.supplierId===id)o.supplierId=''});save();render()},
  ppay:id=>{const p=db.purchases.find(x=>x.id===id);p.paid=!p.paid;save();render()},
  delPurchase:id=>{if(!confirm('Xoá phiếu mua hàng này? Chi phí liên kết với đơn hàng sẽ được tính lại.'))return;db.purchases=db.purchases.filter(x=>x.id!==id);save();render()},
  login:()=>login(),
  logout:()=>{if(auth)auth.signOut()},
  delUser:id=>{if(confirm('Xoá thành viên này? Họ vẫn có thể đăng ký lại và sẽ ở trạng thái chờ duyệt.'))fs.collection('users').doc(id).delete().catch(e=>toast('Lỗi: '+e.message))},
  migrate:()=>{
    let d;try{d=JSON.parse(LS.getItem(KEY))}catch(e){return}
    if(!d||!confirm('Đưa dữ liệu cũ trên máy này lên đám mây? Mục trùng mã sẽ giữ bản trên đám mây.'))return;
    let n=0;COLS.forEach(c=>(d[c]||[]).forEach(x=>{if(!db[c].some(y=>y.id===x.id)){db[c].push(x);n++}}));
    db.seq=Math.max(db.seq||0,d.seq||0);db.qseq=Math.max(db.qseq||0,d.qseq||0);db.pseq=Math.max(db.pseq||0,d.pseq||0);
    if(!(db.shop&&db.shop.name)&&d.shop)db.shop=d.shop;
    save();render();toast('Đã đưa '+n+' mục lên đám mây','ok');
  },
  zoom:id=>{
    const p=prod(id);if(!p||!p.img)return;
    const m=document.createElement('div');m.className='ov';m.style.alignItems='center';
    m.innerHTML=`<div class="md" style="text-align:center;border-radius:16px"><b>${esc(p.name)}</b><div style="margin:10px 0"><img src="${esc(p.img)}" alt="" referrerpolicy="no-referrer" style="max-width:100%;max-height:65vh;border-radius:8px" onerror="imgFail(this)"></div><button class="btn gh" data-x>Đóng</button></div>`;
    document.body.appendChild(m);
    m.onclick=e=>{if(e.target===m||e.target.hasAttribute('data-x'))m.remove()};
  },
  newExp:()=>expForm(),
  delExp:id=>{db.expenses=db.expenses.filter(e=>e.id!==id);save();render()},
  export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='idecal-backup-'+today()+'.json';a.click()},
  import:()=>$('#file').click(),
  reset:()=>{if(CLOUD)return;if(confirm('Xoá TOÀN BỘ dữ liệu? Không thể hoàn tác.')){if(LS)LS.removeItem(KEY);db=blank();render()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)acts[b.dataset.a](b.dataset.id)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('nav-open')){setNav(false);const b=$('#navToggle');if(b)b.focus()}});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('rl')){fs.collection('users').doc(e.target.dataset.id).update({role:e.target.value}).then(()=>toast('Đã cập nhật cấp','ok')).catch(x=>toast('Lỗi: '+x.message));return}
  if(e.target.classList.contains('qs')){const q=db.quotes.find(x=>x.id===e.target.dataset.id);q.status=e.target.value;if(q.status==='Chấp nhận'){convertQuote(q);return}save();render();return}
  if(e.target.classList.contains('st')){const o=db.orders.find(x=>x.id===e.target.dataset.id);const was=o.status;o.status=e.target.value;
    save();render()}
});
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.orders)throw 0;if(confirm('Ghi đè dữ liệu hiện tại bằng file sao lưu?')){db=Object.assign(blank(),d);save();render()}}catch(_){alert('File không hợp lệ')}};r.readAsText(f);e.target.value=''};
if(CLOUD)initCloud();else render();
</script>
