function initCloud(){

function authErr(e){
  const m={'auth/unauthorized-domain':'Tên miền này chưa được thêm vào Firebase (Authentication → Settings → Authorized domains).','auth/popup-closed-by-user':'','auth/cancelled-popup-request':'','auth/network-request-failed':'Mất kết nối mạng.','auth/operation-not-allowed':'Chưa bật đăng nhập Google trong Firebase (Authentication → Sign-in method).'};
  authMsg=m[e.code]!==undefined?m[e.code]:'Lỗi đăng nhập: '+(e.message||e.code);render();
}
function login(){
  authMsg='';const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(p).catch(e=>{if(e.code==='auth/popup-blocked')return auth.signInWithRedirect(p);authErr(e)});

function onUser(u){
  if(unUser){unUser();unUser=null}
  stopSync();me=null;
  if(!u){session='out';render();return}
  session='loading';render();
  const ref=fs.collection('users').doc(u.uid);
  ref.get().then(snap=>{
    if(snap.exists)return;
    const mail=(u.email||'').toLowerCase();
    return ref.set({email:mail,name:u.displayName||mail,photo:u.photoURL||'',role:mail===String(CFG.ownerEmail).trim().toLowerCase()?'owner':'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  }).then(()=>{
    unUser=ref.onSnapshot(s=>{
      const d=s.data();
      if(!d){if(auth.currentUser)setTimeout(()=>onUser(auth.currentUser),0);return}
      const prev=me&&me.role;me={uid:u.uid,...d};
      if(['owner','manager','staff'].includes(d.role)){
        if(prev&&prev!==d.role)stopSync();
        session=ready?'ready':'loading';startSync();
      }else{stopSync();session=d.role==='blocked'?'blocked':'pending'}
      render();
    },e=>{session='error';authMsg='Không đọc được hồ sơ tài khoản: '+e.message;render()});
  }).catch(e=>{session='error';authMsg=(e.code==='permission-denied'?'Quy tắc bảo mật (Firestore Rules) chưa được cài hoặc chưa đúng. Xem README. ':'')+e.message;render()});
}
function sub(q,fn,key){
  need++;
  unsubs.push(q.onSnapshot(s=>{fn(s);loaded[key]=true;checkReady()},e=>{session='error';authMsg='Không đọc được dữ liệu "'+key+'": '+e.message;render()}));
}
function startSync(){
  if(unsubs.length)return;
  need=0;loaded={};synced={counters:JSON.stringify({seq:0,qseq:0,pseq:0}),shop:'{}',suppliers:'[]'};
  COLS.filter(c=>isMgr()||!MGR_COLS.includes(c)).forEach(c=>sub(fs.collection(c),s=>{
    db[c]=s.docs.map(d=>d.data());
    synced[c]=Object.fromEntries(db[c].map(x=>[x.id,JSON.stringify(x)]));
  },c));
  sub(fs.collection('meta'),s=>{s.docs.forEach(d=>{
    if(d.id==='counters'){const v=d.data();db.seq=v.seq||0;db.qseq=v.qseq||0;db.pseq=v.pseq||0;synced.counters=JSON.stringify(cntObj())}
    if(d.id==='shop'){db.shop=d.data();synced.shop=JSON.stringify(db.shop)}
    if(d.id==='suppliers'){db.suppliers=d.data().items||[];synced.suppliers=JSON.stringify(db.suppliers)}
  })},'meta');
  if(isOwner())sub(fs.collection('users'),s=>{usersList=s.docs.map(d=>({uid:d.id,...d.data()}))},'users');
}
function stopSync(){unsubs.forEach(f=>f());unsubs=[];loaded={};need=0;ready=false;synced={};db=blank()}
function checkReady(){if(!ready&&Object.keys(loaded).length>=need){ready=true;session='ready'}render()}
function cloudSave(){
  if(!ready)return;
  const ops=[],strip=x=>JSON.parse(JSON.stringify(x));
  for(const c of COLS){
    if(!loaded[c])continue;
    const old=synced[c]||(synced[c]={}),cur=new Set();
    for(const x of db[c]){cur.add(x.id);const j=JSON.stringify(x);if(old[x.id]!==j){old[x.id]=j;ops.push(['set',fs.collection(c).doc(x.id),strip(x)])}}
    for(const id of Object.keys(old))if(!cur.has(id)){delete old[id];ops.push(['del',fs.collection(c).doc(id)])}
  }
  const cj=JSON.stringify(cntObj());
  if(synced.counters!==cj){synced.counters=cj;ops.push(['set',fs.collection('meta').doc('counters'),cntObj()])}
  const sj=JSON.stringify(db.shop||{});
  if(isMgr()&&synced.shop!==sj){synced.shop=sj;ops.push(['set',fs.collection('meta').doc('shop'),strip(db.shop||{})])}
  const suj=JSON.stringify(db.suppliers||[]);
  if(isMgr()&&synced.suppliers!==suj){synced.suppliers=suj;ops.push(['set',fs.collection('meta').doc('suppliers'),{items:strip(db.suppliers||[])}])}
  for(let i=0;i<ops.length;i+=400){
    const b=fs.batch();
    ops.slice(i,i+400).forEach(o=>o[0]==='set'?b.set(o[1],o[2]):b.delete(o[1]));
    b.commit().catch(e=>toast(e.code==='permission-denied'?'Bạn không có quyền thực hiện thao tác này':'Không lưu được: '+e.message,'err'));
  }
}

function imgFail(el){el.outerHTML='<div class="pth noimg" title="Không tải được ảnh">'+ic('alert')+'</div>'}
function normImg(u){ // '' = trống, null = không hợp lệ, còn lại = link dùng được
  u=(u||'').trim();if(!u)return'';
  const g=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  if(g)return'https://drive.google.com/thumbnail?id='+g[1]+'&sz=w800';
  return/^https?:\/\/\S+$/i.test(u)?u:null;
}
function fileToThumb(file,max=480){ // thu nhỏ + nén JPEG để nhẹ (lưu thẳng trong dữ liệu sản phẩm)
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type||'image/'))return rej(new Error('Đây không phải file ảnh'));
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      let out=c.toDataURL('image/jpeg',.72);if(out.length>150000)out=c.toDataURL('image/jpeg',.55);
      res(out);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Không đọc được ảnh này. Hãy thử file JPG hoặc PNG.'))};
    im.src=url;
  });
}
