:root{--bg:#f3f7fb;--card:#fff;--tx:#142238;--mut:#64748b;--pri:#0879c9;--ok:#16845b;--warn:#c47a08;--bad:#d83b4b;--bd:#dfe8f1;--hh:57px}
@media(prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1c1f28;--tx:#e8eaf0;--mut:#9aa1b2;--bd:#2c303c}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(115deg,#052a59,#0879c9);color:#fff;padding:16px 20px;font-weight:700;font-size:18px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{font-size:12px;font-weight:400;display:flex;align-items:center;gap:6px;text-align:right}
.who .btn{padding:3px 8px;font-size:12px;background:transparent;color:#fff;border:1px solid #fff9}
.auth{max-width:380px;margin:40px auto;text-align:center;padding:24px}
.auth h2{margin-top:4px}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.logo{display:flex;align-items:center;gap:8px}.logo .i{width:22px;height:22px}
.bigic{color:var(--pri);margin-bottom:4px}.bigic.neg{color:var(--bad)}.bigic .i{width:44px;height:44px;stroke-width:1.5}
.toast{display:flex;align-items:center;gap:8px}.toast .i{width:18px;height:18px}.toast.ok .i{color:#4ade80}.toast.err .i{color:#fca5a5}
.pth .i{width:26px;height:26px;stroke-width:1.5;color:var(--mut)}
.pc{display:flex;gap:12px;align-items:flex-start}
.pth{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg);border:1px solid var(--bd);cursor:zoom-in}
.noimg{display:flex;align-items:center;justify-content:center;font-size:26px;cursor:default}
.pv{margin:6px 0;min-height:24px}
.pv img{max-width:100%;max-height:180px;border-radius:10px;border:1px solid var(--bd)}
main{max-width:1080px;margin:0 auto;padding:22px 18px}

.nav-head{display:none}
.nav-group{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin:14px 8px 4px;padding-top:12px;border-top:1px solid var(--bd)}
.navi{width:100%;flex:0 0 auto;min-height:44px;display:flex;align-items:center;gap:10px;justify-content:flex-start;border:1px solid transparent;background:transparent;color:var(--mut);padding:8px 10px;border-radius:12px;font-size:14px;font-family:inherit;cursor:pointer;white-space:normal;text-align:left}

.navi .ni .i{width:19px;height:19px;stroke-width:1.9}
