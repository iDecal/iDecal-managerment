<style>
:root{--bg:#f3f7fb;--card:#fff;--tx:#142238;--mut:#64748b;--pri:#0879c9;--ok:#16845b;--warn:#c47a08;--bad:#d83b4b;--bd:#dfe8f1;--hh:57px}

*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(115deg,#052a59,#0879c9);color:#fff;padding:16px 20px;font-weight:700;font-size:18px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{font-size:12px;font-weight:400;display:flex;align-items:center;gap:6px;text-align:right}

.auth{max-width:380px;margin:40px auto;text-align:center;padding:24px}
.auth h2{margin-top:4px}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.logo{display:flex;align-items:center;gap:8px}.logo .i{width:22px;height:22px}
h1,h2,h3{color:#1557a6;letter-spacing:.1px}h2{font-weight:800;text-shadow:0 1px 0 #dbeafe}h3{color:#6d28d9}.row.sp>h2{background:linear-gradient(90deg,#e0f2fe,#f3e8ff);padding:7px 12px;border-radius:10px;border-left:4px solid #0ea5e9}
.btn .i,.navi .i{filter:drop-shadow(0 1px 1px #00000014)}.btn:not(.gh):not(.dg){background:linear-gradient(135deg,#0879c9,#2563eb);box-shadow:0 3px 8px #0879c925}.navi .ni{width:37px;height:37px;border-radius:11px}.navi .ni .i{width:21px;height:21px;stroke-width:2.1}
.quote-calc{margin-top:10px;background:linear-gradient(135deg,#eff6ff,#faf5ff);border-color:#bfdbfe}.quote-calc .row{padding:3px 0}.quote-calc .tot{border-top:1px solid #c4b5fd;padding-top:9px;margin-top:6px;color:#5b21b6}
.bigic{color:var(--pri);margin-bottom:4px}.bigic.neg{color:var(--bad)}.bigic .i{width:44px;height:44px;stroke-width:1.5}
.toast{display:flex;align-items:center;gap:8px}.toast .i{width:18px;height:18px}.toast.ok .i{color:#4ade80}.toast.err .i{color:#fca5a5}
.pth .i{width:26px;height:26px;stroke-width:1.5;color:var(--mut)}
.pc{display:flex;gap:12px;align-items:flex-start}
.pth{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg);border:1px solid var(--bd);cursor:zoom-in}
.noimg{display:flex;align-items:center;justify-content:center;font-size:26px;cursor:default}
.pv{margin:6px 0;min-height:24px}
.pv img{max-width:100%;max-height:180px;border-radius:10px;border:1px solid var(--bd)}
main{max-width:1080px;margin:0 auto;padding:22px 18px}
nav{position:fixed;top:var(--hh);bottom:0;left:0;width:270px;background:var(--card);border-right:1px solid var(--bd);box-shadow:5px 0 16px #183b5b08;display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:18px 14px calc(16px + env(safe-area-inset-bottom));z-index:6;overflow-y:auto;scrollbar-width:thin}
.nav-head{display:none}
.nav-group{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin:14px 8px 4px;padding-top:12px;border-top:1px solid var(--bd)}
.navi{width:100%;flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:12px;justify-content:flex-start;border:1px solid transparent;background:transparent;color:var(--mut);padding:10px 12px;border-radius:13px;font-size:15px;font-family:inherit;cursor:pointer;white-space:normal;text-align:left}
.navi .ni{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;border-radius:9px;background:#eef2ff;font-weight:400;color:var(--mut);line-height:1;transition:box-shadow .15s}
.navi .ni .i{width:19px;height:19px;stroke-width:1.9}
.navi .count{margin-left:auto;border-radius:99px;min-width:25px;padding:2px 7px;text-align:center;background:#e0f2fe;color:#075985;font-size:12px;font-weight:700}
.navi.on{background:#eff6ff;border-color:#bfdbfe;color:#075985;font-weight:700}
.navi.on .ni{box-shadow:inset 0 0 0 1.5px currentColor}

.burger{display:none;flex:none;width:44px;height:44px;align-items:center;justify-content:center;border:0;background:transparent;color:#fff;border-radius:10px;cursor:pointer}
.burger .i{width:24px;height:24px}
.htitle{display:none}
.nav-scrim{display:none}
@media(min-width:561px){main{margin-left:270px;max-width:1120px;padding:26px 28px}header{padding-left:20px}}
@media(max-width:560px){
nav{top:0;bottom:0;left:0;right:auto;width:min(84vw,320px);transform:translateX(-100%);transition:transform .22s ease;z-index:30;box-shadow:0 0 40px #0006;border-right:1px solid var(--bd);padding:calc(14px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
body.nav-open nav{transform:translateX(0)}
body.nav-open{overflow:hidden}
.nav-scrim{display:block;position:fixed;inset:0;background:#0009;z-index:29;opacity:0;pointer-events:none;transition:opacity .2s}
body.nav-open .nav-scrim{opacity:1;pointer-events:auto}
.nav-head{display:flex;align-items:center;gap:8px;padding:2px 8px 12px;margin-bottom:2px;border-bottom:1px solid var(--bd);font-weight:700;font-size:16px;color:var(--tx)}
.burger{display:inline-flex}
.lname{display:none}
.htitle{display:block;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.who .who-txt{display:none}
main{margin-left:0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
}
@media(prefers-color-scheme:dark){.navi.on{background:#0b2c46;border-color:#1b4a72;color:#bfe3ff}.stage.on{background:#0b2c46;border-color:#1b4a72;color:#bfe3ff}.stage.on .stage-n{color:#bfe3ff}}
@media(prefers-reduced-motion:reduce){nav,.nav-scrim,.navi .ni{transition:none}}
main{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid #e3ebf3;border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 5px 18px #183b5b08}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.kpi small{color:var(--mut);display:block}
.kpi b{font-size:18px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:12px}
.sp{justify-content:space-between}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gh{background:transparent;color:var(--pri);border:1px solid var(--bd)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.dg{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.badge{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;background:var(--bd);color:var(--tx)}
.badge.ok{background:#dcfce7;color:#166534}.badge.wr{background:#fef3c7;color:#92400e}.badge.bd{background:#fee2e2;color:#991b1b}
.mut{color:var(--mut);font-size:13px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit}
textarea{resize:vertical}
input[type=color]{height:42px;padding:3px;cursor:pointer}
.pvbox{height:250px;overflow:hidden;border:1px solid var(--bd);border-radius:10px;background:#fff;position:relative;margin-bottom:2px}
.pvin{width:720px;transform-origin:0 0;pointer-events:none;padding:16px;box-sizing:border-box}
label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}
label.chk{display:flex;gap:8px;align-items:center;color:var(--tx)}
label.chk input{width:auto}
.ov{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:16px}}
@media(max-width:560px){.it{grid-template-columns:minmax(0,1fr) 62px 88px 82px 26px}.it .n{grid-column:1/-1}.card{padding:13px}}
.md h3{margin:0 0 4px}
.it{display:grid;grid-template-columns:minmax(130px,1.5fr) 70px 100px 105px 30px;gap:7px;margin-top:10px;align-items:center}.it .u{min-width:0}.it .n{grid-column:1/-1}
.it .n{grid-column:1/-1}
.it .x{border:0;background:none;color:var(--bad);font-size:20px;cursor:pointer}
.tot{text-align:right;margin-top:10px;font-size:16px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px}
.stagebar{display:flex;align-items:stretch;gap:8px;overflow-x:auto;scrollbar-width:thin;margin-bottom:14px;padding-bottom:4px}
.stage{flex:1 0 auto;min-width:96px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:6px 10px;cursor:pointer;font-family:inherit;color:var(--mut);white-space:nowrap}
.stage .stage-n{font-size:19px;font-weight:800;color:var(--tx);line-height:1.2}
.stage .stage-l{font-size:11px}
.stage.on{background:#eff6ff;border-color:#93c5fd;color:#075985}
.stage.on .stage-n{color:#075985}
.stage.cancel .stage-n{color:var(--bad)}
.stage.cancel.on{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
.stage-sep{display:flex;align-items:center;color:var(--mut);font-size:13px;flex:none;padding:0 1px}
h2{margin:6px 0 12px;font-size:18px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.pbody{flex:1;min-width:0}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:99px;z-index:50;font-size:14px}
.module-search{position:relative;margin:0 0 14px}.module-search input{padding:12px 44px 12px 42px;border-radius:12px;background:var(--card);box-shadow:0 3px 12px #183b5b08}.module-search .search-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}.module-search button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--mut);padding:7px;cursor:pointer}.module-search .search-help{font-size:11px;color:var(--mut);margin:4px 2px 0}.search-no-results{display:none;text-align:center;padding:22px;color:var(--mut)}

/* Navigation icons: clean, consistent monochrome style */
.navi .ni{
  background:#eaf2fb;
  color:#1756a9;
  border:1px solid #d6e4f5;
  box-shadow:none;
}
.navi .ni .i{
  color:inherit;
  stroke:currentColor;
  stroke-width:2;
  filter:none;
}
.navi.on .ni{
  background:#1756a9;
  color:#fff;
  border-color:#1756a9;
  box-shadow:none;
}
.navi.on{
  background:#edf4ff;
  border-color:#c9dcf7;
  color:#174a8b;
}
h2{color:#174ea6;text-shadow:none}
.row.sp>h2{
  background:#edf4ff;
  border-left-color:#2563eb;
  color:#123f88;
  box-shadow:none;
}

/* iDecal visual refinement: Roboto + clean, consistent line icons */
html, body, button, input, select, textarea {
  font-family: 'Roboto', Arial, sans-serif;
}
svg.i {
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.8;
  filter: none;
  flex-shrink: 0;
}
button .i, a .i, .btn .i { vertical-align: middle; }
.navi .ni {
  background: #eaf3fb;
  color: #1769aa;
}
.navi .ni .i { width: 19px; height: 19px; stroke-width: 1.8; }
.navi.active .ni, .navi[aria-current="page"] .ni {
  background: #0879c9;
  color: #fff;
}


/* ================= UI v3: bảng màu + bố cục mới (theo ảnh mẫu), responsive ================= */
:root{--bg:#f4f5fb;--card:#fff;--tx:#151a30;--mut:#6b7186;--pri:#1f4fd8;--pri-d:#173fb0;--soft:#eaf0ff;--ok:#12934a;--warn:#c77a0a;--bad:#df3f45;--bd:#e6e8f2;--hh:64px;
  --sh:0 2px 12px rgba(30,40,100,.05);--r:22px;
  --ok-bg:#e3f6ea;--ok-tx:#0f7a3c;--wr-bg:#fdf0d9;--wr-tx:#965600;--bd-bg:#fdeaea;--bd-tx:#b3262d;--g-bg:#e5f6ec;--g-tx:#12934a;--o-bg:#fdf0d9;--o-tx:#c77a0a;--r-bg:#fdecee;--r-tx:#df3f45;--p-bg:#f0e9fe;--p-tx:#6d3fd1}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c2e;--tx:#eceef8;--mut:#9aa0b8;--pri:#6b8cff;--pri-d:#8aa4ff;--soft:#1f2850;--bd:#2a2f47;--sh:none;
  --ok-bg:#12341f;--ok-tx:#6fdc9b;--wr-bg:#3a2b0e;--wr-tx:#f2c36b;--bd-bg:#3b1a1d;--bd-tx:#ff9aa0;--g-bg:#12341f;--g-tx:#6fdc9b;--o-bg:#3a2b0e;--o-tx:#f2c36b;--r-bg:#3b1a1d;--r-tx:#ff9aa0;--p-bg:#2b2150;--p-tx:#b9a1ff}}
body{background:var(--bg);color:var(--tx);font-family:Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{color:var(--tx);text-shadow:none;letter-spacing:0}
h2,.row.sp>h2{font-weight:700;font-size:20px;background:none;border:0;padding:0;border-radius:0;box-shadow:none;margin:6px 0 12px;color:var(--tx)}
h3{font-weight:700}
a{color:var(--pri)}

/* ---- Header ---- */
header{background:var(--card);color:var(--tx);border-bottom:1px solid var(--bd);min-height:var(--hh);padding:10px 20px;justify-content:flex-start;gap:12px;box-shadow:none}
header .logo{color:var(--pri);font-weight:800}
.htxt{display:flex;flex-direction:column;min-width:0;flex:1}
#hsub{display:none;color:var(--mut);font-size:16px;font-weight:400;line-height:1.3}
.htitle{display:block;font-size:18px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.hact{display:flex;align-items:center;gap:10px;flex:none}
.hact button{width:42px;height:42px;border-radius:50%;border:0;background:var(--soft);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.hact button.pri{background:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(31,79,216,.32)}
.hact .i{width:22px;height:22px;stroke-width:1.9}
.burger{display:none}
.who{color:var(--mut)}
.who .btn{color:var(--pri);border:1px solid var(--bd);background:var(--card);padding:6px 12px;font-size:13px}

/* ---- Thẻ, nút, nhãn ---- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:14px}
.btn{background:var(--pri);color:#fff;border-radius:12px;padding:10px 16px;font-weight:500;font-family:inherit;box-shadow:none;min-height:40px}
.btn:not(.gh):not(.dg){background:var(--pri);box-shadow:none}
.btn:not(.gh):not(.dg):active{background:var(--pri-d)}
.btn.gh{background:var(--card);color:var(--pri);border:1px solid var(--bd)}
.btn.dg{background:var(--card);color:var(--bad);border:1px solid var(--bd)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:34px;border-radius:10px}
.badge{border-radius:99px;padding:3px 11px;font-size:12px;font-weight:500;background:var(--soft);color:var(--pri)}
.badge.ok{background:var(--ok-bg);color:var(--ok-tx)}.badge.wr{background:var(--wr-bg);color:var(--wr-tx)}.badge.bd{background:var(--bd-bg);color:var(--bd-tx)}
.badge.mu{background:var(--bd);color:var(--mut)}
.vendor-badge{background:var(--soft);color:var(--pri)}.vendor-missing{background:var(--wr-bg);color:var(--wr-tx)}
.mut{color:var(--mut)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px;background:var(--card)}
.module-search input{background:var(--card);border-radius:16px;box-shadow:var(--sh)}
.row.sp{gap:10px}
.empty{background:var(--card);border:1px dashed var(--bd);border-radius:var(--r);padding:34px 16px}
.stage{border-radius:16px;background:var(--card)}
.stage.on{background:var(--soft);border-color:var(--pri);color:var(--pri)}.stage.on .stage-n{color:var(--pri)}
.stage.cancel.on{background:var(--r-bg);border-color:var(--bad);color:var(--bd-tx)}
.quote-calc{background:var(--soft);border-color:transparent}
.quote-calc .tot{border-top:1px solid var(--bd);color:var(--pri)}
.bars i{background:var(--pri);opacity:.85}
.pth{border-radius:14px}
.supplier-report-row{padding:12px 0;border-top:1px solid var(--bd)}
.supplier-report-metrics{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut);font-size:13px;margin-top:4px}
.bigic{color:var(--pri)}

/* ---- Menu trái (máy tính) / ngăn kéo ---- */
nav#nav{background:var(--card);border-right:1px solid var(--bd);box-shadow:none}
.nav-group{border-top:1px solid var(--bd);color:var(--mut)}
.navi{border-radius:16px;color:var(--tx);font-weight:500}
.navi .ni{background:var(--soft);color:var(--pri);border:0;border-radius:12px}
.navi.on{background:var(--soft);border-color:transparent;color:var(--pri);font-weight:700}
.navi.on .ni{background:var(--pri);color:#fff;border:0;box-shadow:none}
.navi .count{background:var(--soft);color:var(--pri)}

.module-search{margin-bottom:12px}
.module-search input{height:48px;padding:0 44px 0 44px}
.module-search .search-ic{top:24px}
.module-search button{top:24px}
.module-search .search-help{font-size:12px}
/* ---- Cửa sổ nhập liệu ---- */
.ov{background:rgba(15,18,40,.5);backdrop-filter:blur(2px)}
.md{border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(15,18,40,.18)}
.md>h3:first-child{font-size:19px;margin-bottom:6px}
@media(min-width:700px){.md{border-radius:24px}}
.it{padding:12px;margin-top:10px;background:var(--bg);border:1px solid var(--bd);border-radius:16px}
.it input,.it select{background:var(--card)}
.it .x{width:34px;height:34px;border-radius:10px;background:var(--r-bg);color:var(--bad);font-size:18px;line-height:1;padding:0}

/* ---- Trang Tổng quan ---- */
.shopchip{display:flex;align-items:center;gap:10px;border:1.5px solid var(--pri);background:var(--soft);color:var(--pri);border-radius:16px;padding:13px 16px;font-weight:700;font-size:16px;margin:4px 0 16px}
.shopchip .i{width:24px;height:24px;stroke-width:1.7}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:6px}
@media(min-width:900px){.kgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kcard{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:14px;text-align:left;width:100%;font:inherit;color:var(--tx);cursor:pointer;margin:0;min-height:116px;padding:16px}

/* ================= Đăng nhập + đồng bộ đám mây (Firebase) ================= */
const CFG=window.IDECAL_CONFIG||{};
const FB=CFG.firebase||{};
const CLOUD=!!FB.apiKey;
const COLS=['customers','products','orders','quotes','purchases','expenses'];
const MGR_COLS=['purchases','expenses'];
const ROLE_NAME={owner:'Chủ',manager:'Quản lý',staff:'Nhân viên',pending:'Chờ duyệt',blocked:'Bị khoá'};
let fs=null,auth=null,me=null,session=CLOUD?'loading':'ready',authMsg='',usersList=[],unsubs=[],loaded={},need=0,ready=false,synced={},unUser=null;
const role=()=>CLOUD?(me&&me.role):'owner';
const isOwner=()=>role()==='owner';
const isMgr=()=>role()==='owner'||role()==='manager';
const canSee=r=>r==='all'||(r==='mgr'&&isMgr())||(r==='owner'&&CLOUD&&isOwner());
const tabsFor=()=>TABS.filter(t=>canSee(t.req));
const cntObj=()=>({seq:db.seq||0,qseq:db.qseq||0,pseq:db.pseq||0});

function initCloud(){
  if(typeof firebase==='undefined'){session='error';authMsg='Không tải được Firebase (mất mạng hoặc bị chặn). Hãy kiểm tra kết nối rồi tải lại trang.';render();return}
  if(!String(CFG.ownerEmail||'').trim()){session='error';authMsg='Chưa điền ownerEmail (Gmail của chủ cửa hàng) trong file config.js.';render();return}
  try{firebase.initializeApp(FB);auth=firebase.auth();fs=firebase.firestore()}
  catch(e){session='error';authMsg='Cấu hình Firebase không đúng: '+e.message;render();return}
  auth.getRedirectResult().catch(authErr);
  auth.onAuthStateChanged(onUser);
}
function authErr(e){
  const m={'auth/unauthorized-domain':'Tên miền này chưa được thêm vào Firebase (Authentication → Settings → Authorized domains).','auth/popup-closed-by-user':'','auth/cancelled-popup-request':'','auth/network-request-failed':'Mất kết nối mạng.','auth/operation-not-allowed':'Chưa bật đăng nhập Google trong Firebase (Authentication → Sign-in method).'};
  authMsg=m[e.code]!==undefined?m[e.code]:'Lỗi đăng nhập: '+(e.message||e.code);render();
}
function login(){
  authMsg='';const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(p).catch(e=>{if(e.code==='auth/popup-blocked')return auth.signInWithRedirect(p);authErr(e)});
}
function onUser(u){
  if(unUser){unUser();unUser=null}
  stopSync();me=null;
  if(!u){session='out';render();return}
  session='loading';render();
  const ref=fs.collection('users').doc(u.uid);
  ref.get().then(snap=>{
    if(snap.exists)return;
    const mail=(u.email||'').toLowerCase();
    return ref.set({email:mail,name:u.displayName||mail,photo:u.photoURL||'',role:mail===String(CFG.ownerEmail).trim().toLowerCase()?'owner':'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  }).then(()=>{
    unUser=ref.onSnapshot(s=>{
      const d=s.data();
      if(!d){if(auth.currentUser)setTimeout(()=>onUser(auth.currentUser),0);return}
      const prev=me&&me.role;me={uid:u.uid,...d};
      if(['owner','manager','staff'].includes(d.role)){
        if(prev&&prev!==d.role)stopSync();
        session=ready?'ready':'loading';startSync();
      }else{stopSync();session=d.role==='blocked'?'blocked':'pending'}
      render();
    },e=>{session='error';authMsg='Không đọc được hồ sơ tài khoản: '+e.message;render()});
  }).catch(e=>{session='error';authMsg=(e.code==='permission-denied'?'Quy tắc bảo mật (Firestore Rules) chưa được cài hoặc chưa đúng. Xem README. ':'')+e.message;render()});
}
function sub(q,fn,key){
  need++;
  unsubs.push(q.onSnapshot(s=>{fn(s);loaded[key]=true;checkReady()},e=>{session='error';authMsg='Không đọc được dữ liệu "'+key+'": '+e.message;render()}));
}
function startSync(){
  if(unsubs.length)return;
  need=0;loaded={};synced={counters:JSON.stringify({seq:0,qseq:0,pseq:0}),shop:'{}',suppliers:'[]'};
  COLS.filter(c=>isMgr()||!MGR_COLS.includes(c)).forEach(c=>sub(fs.collection(c),s=>{
    db[c]=s.docs.map(d=>d.data());
    synced[c]=Object.fromEntries(db[c].map(x=>[x.id,JSON.stringify(x)]));
  },c));
  sub(fs.collection('meta'),s=>{s.docs.forEach(d=>{
    if(d.id==='counters'){const v=d.data();db.seq=v.seq||0;db.qseq=v.qseq||0;db.pseq=v.pseq||0;synced.counters=JSON.stringify(cntObj())}
    if(d.id==='shop'){db.shop=d.data();synced.shop=JSON.stringify(db.shop)}
    if(d.id==='suppliers'){db.suppliers=d.data().items||[];synced.suppliers=JSON.stringify(db.suppliers)}
  })},'meta');
  if(isOwner())sub(fs.collection('users'),s=>{usersList=s.docs.map(d=>({uid:d.id,...d.data()}))},'users');
}
function stopSync(){unsubs.forEach(f=>f());unsubs=[];loaded={};need=0;ready=false;synced={};db=blank()}
function checkReady(){if(!ready&&Object.keys(loaded).length>=need){ready=true;session='ready'}render()}
function cloudSave(){
  if(!ready)return;
  const ops=[],strip=x=>JSON.parse(JSON.stringify(x));
  for(const c of COLS){
    if(!loaded[c])continue;
    const old=synced[c]||(synced[c]={}),cur=new Set();
    for(const x of db[c]){cur.add(x.id);const j=JSON.stringify(x);if(old[x.id]!==j){old[x.id]=j;ops.push(['set',fs.collection(c).doc(x.id),strip(x)])}}
    for(const id of Object.keys(old))if(!cur.has(id)){delete old[id];ops.push(['del',fs.collection(c).doc(id)])}
  }
  const cj=JSON.stringify(cntObj());
  if(synced.counters!==cj){synced.counters=cj;ops.push(['set',fs.collection('meta').doc('counters'),cntObj()])}
  const sj=JSON.stringify(db.shop||{});

function supplierChoices(){
  db.suppliers=db.suppliers||[];
  const choices=db.suppliers.map(s=>({...s}));
  const seen=new Set(choices.map(s=>String(s.name||'').trim().toLocaleLowerCase('vi')));
  const legacyNames=[...(db.purchases||[]).map(p=>p.supplier),...(db.orders||[]).map(o=>o.supplierName)];
  for(const raw of legacyNames){
    const name=String(raw||'').trim(),key=name.toLocaleLowerCase('vi');
    if(!name||name==='Khách lẻ'||seen.has(key))continue;
    seen.add(key);choices.push({id:'legacy-'+name,name,legacy:true});
  }
  return choices.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'vi'));
}

function imgFail(el){el.outerHTML='<div class="pth noimg" title="Không tải được ảnh">'+ic('alert')+'</div>'}
function normImg(u){ // '' = trống, null = không hợp lệ, còn lại = link dùng được
  u=(u||'').trim();if(!u)return'';
  const g=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  if(g)return'https://drive.google.com/thumbnail?id='+g[1]+'&sz=w800';
  return/^https?:\/\/\S+$/i.test(u)?u:null;
}
function fileToThumb(file,max=480){ // thu nhỏ + nén JPEG để nhẹ (lưu thẳng trong dữ liệu sản phẩm)
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type||'image/'))return rej(new Error('Đây không phải file ảnh'));
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      let out=c.toDataURL('image/jpeg',.72);if(out.length>150000)out=c.toDataURL('image/jpeg',.55);
      res(out);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Không đọc được ảnh này. Hãy thử file JPG hoặc PNG.'))};
    im.src=url;
  });
}

function readItems(m){
  return[...m.querySelectorAll('.it')].map(r=>{
    const pid=r.querySelector('.p').value,p=prod(pid);
    return{pid,name:p?p.name:r.querySelector('.n').value.trim(),qty:+r.querySelector('.q').value||0,price:+r.querySelector('.pr').value||0,cost:p?p.cost:0,unit:(r.querySelector('.u')?.value||'').trim()||(p?p.unit:'')};
  }).filter(i=>i.name&&i.qty>0);

function itemEditor(m,items){
  const box=m.querySelector('#items');
  const calc=()=>{let t=0;box.querySelectorAll('.it').forEach(r=>t+=Math.round((+r.querySelector('.q').value||0)*(+r.querySelector('.pr').value||0)));const d=+(m.querySelector('[name=discount]')||{}).value||0,base=Math.max(0,t-d),rate=+((m.querySelector('[name=vatRate]')||{}).value??8)||0,vat=Math.round(base*rate/100);const sub=m.querySelector('#sub'),v=m.querySelector('#vat'),vl=m.querySelector('#vatLabel');if(sub)sub.textContent=vnd(t);if(v)v.textContent=vnd(vat);if(vl)vl.textContent=rate;m.querySelector('#tot').textContent=vnd(base+vat)};
  const addRow=(it={})=>{
    const r=document.createElement('div');r.className='it';
    r.innerHTML=`<select class="p"><option value="">Khác (nhập tay)…</option>${db.products.map(p=>`<option value="${p.id}" ${p.id===it.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      <input class="q" type="number" min="0" step="any" inputmode="decimal" title="Số lượng" placeholder="SL" value="${it.qty||1}"><input class="pr" type="number" step="any" inputmode="decimal" placeholder="Đơn giá" title="Đơn giá" value="${it.price??''}"><input class="u" placeholder="ĐVT" title="Đơn vị tính (m², mét, cái…)" value="${esc(it.unit||(prod(it.pid)||{}).unit||'cái')}"><button type="button" class="x">×</button>
      <input class="n" placeholder="Tên hàng / mô tả, kích thước" value="${esc(it.pid?'':it.name||'')}" style="display:${it.pid?'none':'block'}">`;
    box.appendChild(r);
    const sel=r.querySelector('.p');
    sel.onchange=()=>{const p=prod(sel.value);r.querySelector('.n').style.display=p?'none':'block';if(p)r.querySelector('.pr').value=p.price;calc()};
    r.querySelector('.x').onclick=()=>{if(box.children.length>1){r.remove();calc()}};
    calc();
  };
  m.addEventListener('input',calc);
  items.forEach(addRow);
  m.querySelector('#addI').onclick=()=>addRow();
}
