<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>iDecal - Quản lý kinh doanh</title>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#1f2430;--mut:#6b7280;--pri:#4f46e5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1c1f28;--tx:#e8eaf0;--mut:#9aa1b2;--bd:#2c303c}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px}
header{background:var(--pri);color:#fff;padding:14px 16px;font-weight:700;font-size:18px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{font-size:12px;font-weight:400;display:flex;align-items:center;gap:6px;text-align:right}
.who .btn{padding:3px 8px;font-size:12px;background:transparent;color:#fff;border:1px solid #fff9}
.auth{max-width:380px;margin:40px auto;text-align:center;padding:24px}
.auth h2{margin-top:4px}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.logo{display:flex;align-items:center;gap:8px}.logo .i{width:22px;height:22px}
.bigic{color:var(--pri);margin-bottom:4px}.bigic.neg{color:var(--bad)}.bigic .i{width:44px;height:44px;stroke-width:1.5}
.toast{display:flex;align-items:center;gap:8px}.toast .i{width:18px;height:18px}.toast.ok .i{color:#4ade80}.toast.err .i{color:#fca5a5}
.pth .i{width:26px;height:26px;stroke-width:1.5;color:var(--mut)}
.pc{display:flex;gap:12px;align-items:flex-start}
.pth{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg);border:1px solid var(--bd);cursor:zoom-in}
.noimg{display:flex;align-items:center;justify-content:center;font-size:26px;cursor:default}
.pv{margin:6px 0;min-height:24px}
.pv img{max-width:100%;max-height:180px;border-radius:10px;border:1px solid var(--bd)}
main{max-width:860px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:5;overflow-x:auto}
nav button{flex:1 0 auto;min-width:62px;border:0;background:none;color:var(--mut);padding:10px 4px;font-size:10px;cursor:pointer}
nav button b{display:block;width:max-content;margin:0 auto 2px;padding:4px 16px;border-radius:99px;font-weight:400;line-height:0;transition:background .15s}
nav button .i{width:22px;height:22px;stroke-width:1.7}
nav button.on b{background:color-mix(in srgb,var(--pri) 15%,transparent)}
nav button.on .i{stroke-width:2.1}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.kpi small{color:var(--mut);display:block}
.kpi b{font-size:18px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:12px}
.sp{justify-content:space-between}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gh{background:transparent;color:var(--pri);border:1px solid var(--bd)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.dg{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.badge{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;background:var(--bd);color:var(--tx)}
.badge.ok{background:#dcfce7;color:#166534}.badge.wr{background:#fef3c7;color:#92400e}.badge.bd{background:#fee2e2;color:#991b1b}
.mut{color:var(--mut);font-size:13px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}
label.chk{display:flex;gap:8px;align-items:center;color:var(--tx)}
label.chk input{width:auto}
.ov{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:16px}}
.md h3{margin:0 0 4px}
.it{display:grid;grid-template-columns:1fr 60px 90px 30px;gap:6px;margin-top:8px}
.it .n{grid-column:1/-1}
.it .x{border:0;background:none;color:var(--bad);font-size:20px;cursor:pointer}
.tot{text-align:right;margin-top:10px;font-size:16px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:6px;margin-bottom:6px}
.chips button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
h2{margin:6px 0 12px;font-size:18px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.pbody{flex:1;min-width:0}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:99px;z-index:50;font-size:14px}
</style>
</head>
<body>
<header><span class="logo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1" fill="currentColor"/></svg> iDecal</span><span id="who" class="who"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<input type="file" id="file" accept="application/json" hidden>
<script>
const KEY='idecal_v1';
const ICONS={
  dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  clipboard:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/>',
  filetext:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/>',
  cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
  wallet:'<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
  sliders:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  pdf:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 12v6M9 15l3 3 3-3"/>',
  printer:'<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  check:'<circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/>',
  store:'<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/>',
  cloud:'<path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9M16 16l-4-4-4 4"/>',
  login:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  alert:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  ban:'<circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  tag:'<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1" fill="currentColor"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',
  pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'
};
const ic=(n,sz)=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${sz?` style="width:${sz}px;height:${sz}px"`:''}>${ICONS[n]||''}</svg>`;
const LS=(()=>{try{const s=window.localStorage;s.setItem('__t','1');s.removeItem('__t');return s}catch(e){return null}})();
const WARN='<div class="card" style="border-color:var(--warn)"><b>'+ic('alert')+' Chưa lưu được dữ liệu</b><div class="mut">Trình duyệt đang chặn việc lưu (thường do xem trước trong khung chat hoặc chế độ riêng tư). Bạn vẫn thêm được dữ liệu nhưng sẽ <b>mất khi đóng/tải lại trang</b>. Hãy tải file về rồi mở bằng Chrome/Safari, hoặc dùng bản đã deploy trên Vercel.</div></div>';

/* ================= Đăng nhập + đồng bộ đám mây (Firebase) ================= */
const CFG=window.IDECAL_CONFIG||{};
const FB=CFG.firebase||{};
const CLOUD=!!FB.apiKey;
const COLS=['customers','products','orders','quotes','purchases','expenses'];
const MGR_COLS=['purchases','expenses'];
const ROLE_NAME={owner:'Chủ',manager:'Quản lý',staff:'Nhân viên',pending:'Chờ duyệt',blocked:'Bị khoá'};
let fs=null,auth=null,me=null,session=CLOUD?'loading':'ready',authMsg='',usersList=[],unsubs=[],loaded={},need=0,ready=false,synced={},unUser=null;
const role=()=>CLOUD?(me&&me.role):'owner';
const isOwner=()=>role()==='owner';
const isMgr=()=>role()==='owner'||role()==='manager';
const tabsFor=()=>{const t=TABS.filter(x=>isMgr()||!['buy','exp'].includes(x[0]));if(CLOUD&&isOwner())t.splice(t.length-1,0,['team','shield','Thành viên']);return t};
const cntObj=()=>({seq:db.seq||0,qseq:db.qseq||0,pseq:db.pseq||0});

function initCloud(){
  if(typeof firebase==='undefined'){session='error';authMsg='Không tải được Firebase (mất mạng hoặc bị chặn). Hãy kiểm tra kết nối rồi tải lại trang.';render();return}
  if(!String(CFG.ownerEmail||'').trim()){session='error';authMsg='Chưa điền ownerEmail (Gmail của chủ cửa hàng) trong file config.js.';render();return}
  try{firebase.initializeApp(FB);auth=firebase.auth();fs=firebase.firestore()}
  catch(e){session='error';authMsg='Cấu hình Firebase không đúng: '+e.message;render();return}
  auth.getRedirectResult().catch(authErr);
  auth.onAuthStateChanged(onUser);
}
function authErr(e){
  const m={'auth/unauthorized-domain':'Tên miền này chưa được thêm vào Firebase (Authentication → Settings → Authorized domains).','auth/popup-closed-by-user':'','auth/cancelled-popup-request':'','auth/network-request-failed':'Mất kết nối mạng.','auth/operation-not-allowed':'Chưa bật đăng nhập Google trong Firebase (Authentication → Sign-in method).'};
  authMsg=m[e.code]!==undefined?m[e.code]:'Lỗi đăng nhập: '+(e.message||e.code);render();
}
function login(){
  authMsg='';const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(p).catch(e=>{if(e.code==='auth/popup-blocked')return auth.signInWithRedirect(p);authErr(e)});
}
function onUser(u){
  if(unUser){unUser();unUser=null}
  stopSync();me=null;
  if(!u){session='out';render();return}
  session='loading';render();
  const ref=fs.collection('users').doc(u.uid);
  ref.get().then(snap=>{
    if(snap.exists)return;
    const mail=(u.email||'').toLowerCase();
    return ref.set({email:mail,name:u.displayName||mail,photo:u.photoURL||'',role:mail===String(CFG.ownerEmail).trim().toLowerCase()?'owner':'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  }).then(()=>{
    unUser=ref.onSnapshot(s=>{
      const d=s.data();
      if(!d){if(auth.currentUser)setTimeout(()=>onUser(auth.currentUser),0);return}
      const prev=me&&me.role;me={uid:u.uid,...d};
      if(['owner','manager','staff'].includes(d.role)){
        if(prev&&prev!==d.role)stopSync();
        session=ready?'ready':'loading';startSync();
      }else{stopSync();session=d.role==='blocked'?'blocked':'pending'}
      render();
    },e=>{session='error';authMsg='Không đọc được hồ sơ tài khoản: '+e.message;render()});
  }).catch(e=>{session='error';authMsg=(e.code==='permission-denied'?'Quy tắc bảo mật (Firestore Rules) chưa được cài hoặc chưa đúng. Xem README. ':'')+e.message;render()});
}
function sub(q,fn,key){
  need++;
  unsubs.push(q.onSnapshot(s=>{fn(s);loaded[key]=true;checkReady()},e=>{session='error';authMsg='Không đọc được dữ liệu "'+key+'": '+e.message;render()}));
}
function startSync(){
  if(unsubs.length)return;
  need=0;loaded={};synced={counters:JSON.stringify({seq:0,qseq:0,pseq:0}),shop:'{}'};
  COLS.filter(c=>isMgr()||!MGR_COLS.includes(c)).forEach(c=>sub(fs.collection(c),s=>{
    db[c]=s.docs.map(d=>d.data());
    synced[c]=Object.fromEntries(db[c].map(x=>[x.id,JSON.stringify(x)]));
  },c));
  sub(fs.collection('meta'),s=>{s.docs.forEach(d=>{
    if(d.id==='counters'){const v=d.data();db.seq=v.seq||0;db.qseq=v.qseq||0;db.pseq=v.pseq||0;synced.counters=JSON.stringify(cntObj())}
    if(d.id==='shop'){db.shop=d.data();synced.shop=JSON.stringify(db.shop)}
  })},'meta');
  if(isOwner())sub(fs.collection('users'),s=>{usersList=s.docs.map(d=>({uid:d.id,...d.data()}))},'users');
}
function stopSync(){unsubs.forEach(f=>f());unsubs=[];loaded={};need=0;ready=false;synced={};db=blank()}
function checkReady(){if(!ready&&Object.keys(loaded).length>=need){ready=true;session='ready'}render()}
function cloudSave(){
  if(!ready)return;
  const ops=[],strip=x=>JSON.parse(JSON.stringify(x));
  for(const c of COLS){
    if(!loaded[c])continue;
    const old=synced[c]||(synced[c]={}),cur=new Set();
    for(const x of db[c]){cur.add(x.id);const j=JSON.stringify(x);if(old[x.id]!==j){old[x.id]=j;ops.push(['set',fs.collection(c).doc(x.id),strip(x)])}}
    for(const id of Object.keys(old))if(!cur.has(id)){delete old[id];ops.push(['del',fs.collection(c).doc(id)])}
  }
  const cj=JSON.stringify(cntObj());
  if(synced.counters!==cj){synced.counters=cj;ops.push(['set',fs.collection('meta').doc('counters'),cntObj()])}
  const sj=JSON.stringify(db.shop||{});
  if(isMgr()&&synced.shop!==sj){synced.shop=sj;ops.push(['set',fs.collection('meta').doc('shop'),strip(db.shop||{})])}
  for(let i=0;i<ops.length;i+=400){
    const b=fs.batch();
    ops.slice(i,i+400).forEach(o=>o[0]==='set'?b.set(o[1],o[2]):b.delete(o[1]));
    b.commit().catch(e=>toast(e.code==='permission-denied'?'Bạn không có quyền thực hiện thao tác này':'Không lưu được: '+e.message,'err'));
  }
}
const hasLocal=()=>{try{const d=JSON.parse(LS.getItem(KEY));return !!d&&COLS.some(k=>(d[k]||[]).length)}catch(e){return false}};
const STATUS=['Mới','Đang thiết kế','Đang in','Hoàn thành','Đã giao','Huỷ'];
const TABS=[['home','dash','Tổng quan'],['orders','clipboard','Đơn hàng'],['quote','filetext','Báo giá'],['cust','users','Khách'],['prod','box','Sản phẩm'],['buy','cart','Mua hàng'],['exp','wallet','Chi phí'],['more','sliders','Khác']];
let db=load(),view='home',filter='Tất cả';

function blank(){return{orders:[],customers:[],products:[],expenses:[],quotes:[],purchases:[],seq:0,qseq:0,pseq:0,shop:{}}}
function load(){try{if(LS){const d=JSON.parse(LS.getItem(KEY));if(d)return Object.assign(blank(),d)}}catch(e){}return blank()}
function save(){
  if(CLOUD){cloudSave();return}
  if(!LS)return;try{LS.setItem(KEY,JSON.stringify(db))}catch(e){toast('Không lưu được dữ liệu (bộ nhớ trình duyệt đầy?). Hãy xuất sao lưu.')}
}
const uid=()=>Math.random().toString(36).slice(2,12);
const today=()=>new Date().toLocaleDateString('sv');
const vnd=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n||0))+'đ';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const total=o=>o.items.reduce((s,i)=>s+i.qty*i.price,0);
const cogs=o=>o.items.reduce((s,i)=>s+i.qty*(i.cost||0),0);
const cust=id=>db.customers.find(c=>c.id===id);
const prod=id=>db.products.find(p=>p.id===id);
const valid=o=>o.status!=='Huỷ';

/* ---------- Modal ---------- */
function modal(title,body,onSave){
  const m=document.createElement('div');m.className='ov';
  m.innerHTML=`<form class="md"><h3>${title}</h3>${body}<div class="row end"><button type="button" class="btn gh" data-x>Đóng</button><button class="btn">Lưu</button></div></form>`;
  document.body.appendChild(m);
  m.querySelector('[data-x]').onclick=()=>m.remove();

function imgFail(el){el.outerHTML='<div class="pth noimg" title="Không tải được ảnh">'+ic('alert')+'</div>'}
function normImg(u){ // '' = trống, null = không hợp lệ, còn lại = link dùng được
  u=(u||'').trim();if(!u)return'';
  const g=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  if(g)return'https://drive.google.com/thumbnail?id='+g[1]+'&sz=w800';
  return/^https?:\/\/\S+$/i.test(u)?u:null;
}
function fileToThumb(file,max=480){ // thu nhỏ + nén JPEG để nhẹ (lưu thẳng trong dữ liệu sản phẩm)
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type||'image/'))return rej(new Error('Đây không phải file ảnh'));
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      let out=c.toDataURL('image/jpeg',.72);if(out.length>150000)out=c.toDataURL('image/jpeg',.55);
      res(out);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Không đọc được ảnh này. Hãy thử file JPG hoặc PNG.'))};
    im.src=url;
  });
}

const QST=['Nháp','Đã gửi','Chấp nhận','Từ chối'];
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv')};
const qtotal=q=>Math.max(0,total(q)-(q.discount||0));
const qname=q=>{const c=cust(q.cid);return c?c.name:(q.cname||'Khách lẻ')};

function readItems(m){
  return[...m.querySelectorAll('.it')].map(r=>{
    const pid=r.querySelector('.p').value,p=prod(pid);
    return{pid,name:p?p.name:r.querySelector('.n').value.trim(),qty:+r.querySelector('.q').value||0,price:+r.querySelector('.pr').value||0,cost:p?p.cost:0};
  }).filter(i=>i.name&&i.qty>0);
}
function itemEditor(m,items){
  const box=m.querySelector('#items');
  const calc=()=>{let t=0;box.querySelectorAll('.it').forEach(r=>t+=(+r.querySelector('.q').value||0)*(+r.querySelector('.pr').value||0));const d=+(m.querySelector('[name=discount]')||{}).value||0;m.querySelector('#tot').textContent=vnd(Math.max(0,t-d))};
  const addRow=(it={})=>{
    const r=document.createElement('div');r.className='it';
    r.innerHTML=`<select class="p"><option value="">Khác (nhập tay)…</option>${db.products.map(p=>`<option value="${p.id}" ${p.id===it.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      <input class="q" type="number" min="1" value="${it.qty||1}"><input class="pr" type="number" placeholder="Giá" value="${it.price??''}"><button type="button" class="x">×</button>
      <input class="n" placeholder="Tên hàng / mô tả, kích thước" value="${esc(it.pid?'':it.name||'')}" style="display:${it.pid?'none':'block'}">`;
    box.appendChild(r);
    const sel=r.querySelector('.p');
    sel.onchange=()=>{const p=prod(sel.value);r.querySelector('.n').style.display=p?'none':'block';if(p)r.querySelector('.pr').value=p.price;calc()};
    r.querySelector('.x').onclick=()=>{if(box.children.length>1){r.remove();calc()}};
    calc();
  };
  m.addEventListener('input',calc);
  items.forEach(addRow);
  m.querySelector('#addI').onclick=()=>addRow();
}
function quoteForm(id){
  const q=db.quotes.find(x=>x.id===id)||{date:today(),until:addDays(today(),7),status:'Nháp',items:[{}],discount:0};
  const m=modal(id?'Sửa báo giá '+q.code:'Báo giá mới',`
    <label>Khách hàng<select name="cid"><option value="">Khách lẻ</option>${db.customers.map(c=>`<option value="${c.id}" ${c.id===q.cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
    ${fld('Tên khách (nếu là khách lẻ)','cname',q.cname||'')}
    ${fld('Ngày','date',q.date,'date','required')}
    ${fld('Hiệu lực đến','until',q.until||'','date')}
    <label>Hàng hoá</label><div id="items"></div>
    <button type="button" class="btn gh sm" id="addI" style="margin-top:8px">${ic('plus')} Thêm dòng</button>
    ${fld('Giảm giá (đ)','discount',q.discount||0,'number','min=0')}
    ${fld('Ghi chú / điều khoản','note',q.note||'')}
    <div class="tot">Tổng: <b id="tot">0đ</b></div>`,
  (fd,m)=>{
    const items=readItems(m);
    if(!items.length){alert('Cần ít nhất 1 dòng hàng hợp lệ');return false}
    const data={cid:fd.get('cid'),cname:fd.get('cname'),date:fd.get('date'),until:fd.get('until'),discount:+fd.get('discount')||0,note:fd.get('note'),items};
    if(id)Object.assign(q,data);else db.quotes.push({id:uid(),code:'BG'+String(++db.qseq).padStart(4,'0'),status:'Nháp',...data});
    save();render();
  });
  itemEditor(m,q.items);
}
function shopForm(){
  const s=db.shop||{};
  modal('Thông tin cửa hàng',fld('Tên cửa hàng','name',s.name||'iDecal')+fld('SĐT / Zalo','phone',s.phone||'','tel')+fld('Địa chỉ','addr',s.addr||'')+fld('Tài khoản ngân hàng','bank',s.bank||'')+fld('Lời cảm ơn / chân trang','foot',s.foot||''),fd=>{
    db.shop={name:fd.get('name'),phone:fd.get('phone'),addr:fd.get('addr'),bank:fd.get('bank'),foot:fd.get('foot')};save();render();
  });
}
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'');

.doc h1{margin:0;font-size:22px;color:#111}.doc h2{text-align:center;margin:18px 0 2px;font-size:20px;color:#111}
.doc table{width:100%;border-collapse:collapse;margin-top:14px}.doc th,.doc td{border:1px solid #bbb;padding:6px 8px;text-align:left;color:#111}.doc th{background:#eee}
.doc .r{text-align:right}.doc .tt{text-align:right;margin-top:8px}.doc .c{text-align:center;color:#555}
.doc .sig{display:flex;justify-content:space-between;margin-top:50px;text-align:center}`;

function purchaseHTML(p){
  const s=db.shop||{};

function toast(t,k){const d=document.createElement('div');d.className='toast'+(k?' '+k:'');d.innerHTML=(k?ic(k==='err'?'alert':'check'):'')+'<span>'+esc(t)+'</span>';document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
function printDoc(title,body){
  const w=window.open('','_blank');
  if(!w){alert('Trình duyệt đang chặn cửa sổ mới. Hãy cho phép popup rồi thử lại.');return}
  w.document.write(`<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{margin:20px auto;max-width:760px;padding:0 16px}${DOC_CSS}@media print{body{margin:0}}</style></head><body><div class="doc">${body}</div><script>onload=()=>setTimeout(()=>print(),300)<\/script></body></html>`);
  w.document.close();
}
function pdfDoc(filename,title,body){
  if(typeof html2pdf==='undefined'){
    if(confirm('Chưa tải được thư viện xuất PDF (có thể do mất mạng). Mở trang in để chọn "Lưu thành PDF"?'))printDoc(title,body);
    return;
  }
  const el=document.createElement('div');
  el.innerHTML=`<style>${DOC_CSS}</style><div class="doc">${body}</div>`;
  toast('Đang tạo PDF…');
  html2pdf().set({margin:10,filename,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['tr','.sig']}})
    .from(el).save().then(()=>toast('Đã tải '+filename,'ok')).catch(()=>alert('Xuất PDF thất bại. Hãy thử nút In rồi chọn "Lưu thành PDF".'));
}
function printQuote(id){const q=db.quotes.find(x=>x.id===id);printDoc(q.code,quoteHTML(q))}
function pdfQuote(id){const q=db.quotes.find(x=>x.id===id);pdfDoc(q.code+'-'+(slug(qname(q))||'khach')+'.pdf',q.code,quoteHTML(q))}
function printPurchase(id){const p=db.purchases.find(x=>x.id===id);printDoc(p.code,purchaseHTML(p))}
function pdfPurchase(id){const p=db.purchases.find(x=>x.id===id);pdfDoc(p.code+'-'+(slug(p.supplier)||'ncc')+'.pdf',p.code,purchaseHTML(p))}
function convertQuote(q){
  if(!q||db.orders.some(o=>o.id===q.orderId))return;
  const items=q.items.map(i=>({...i}));
  if(q.discount)items.push({pid:'',name:'Giảm giá',qty:1,price:-q.discount,cost:0});
  items.forEach(i=>{const p=prod(i.pid);if(p)p.stock-=i.qty});
  const o={id:uid(),code:'DH'+String(++db.seq).padStart(4,'0'),cid:q.cid,date:today(),status:'Mới',paid:false,note:'Từ '+q.code+(!q.cid&&q.cname?' · '+q.cname:''),items};
  db.orders.push(o);q.orderId=o.id;q.status='Chấp nhận';save();render();toast('Đã chuyển '+q.code+' thành đơn '+o.code,'ok');
}

  const list=[...db.quotes].sort((a,b)=>b.date.localeCompare(a.date)||b.code.localeCompare(a.code));
  return`<div class="row sp"><h2>Báo giá</h2><button class="btn" data-a="newQuote">${ic('plus')} Báo giá</button></div>
  ${list.length?list.map(q=>`<div class="card">
    <div class="row sp"><b>${q.code} · ${esc(qname(q))}</b><b>${vnd(qtotal(q))}</b></div>
    <div class="mut">${q.date}${q.until?' · HL đến '+q.until:''} · ${q.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div>
    <div class="row" style="margin-top:8px">
      <select class="qs" data-id="${q.id}" style="width:auto" ${db.orders.some(o=>o.id===q.orderId)?'disabled':''}>${QST.map(s=>`<option ${s===q.status?'selected':''}>${s}</option>`).join('')}</select>
      ${db.orders.some(o=>o.id===q.orderId)?`<span class="badge ok">Đã chuyển thành đơn ${esc((db.orders.find(o=>o.id===q.orderId)||{}).code)}</span><button class="btn gh sm" data-a="viewOrder">Xem đơn</button>`:(q.status==='Từ chối'?'':`<button class="btn sm" data-a="toOrder" data-id="${q.id}">${ic('check')} Khách chấp nhận</button>`)}
      <button class="btn sm" data-a="pdfQuote" data-id="${q.id}">${ic('pdf')} PDF</button>
      <button class="btn gh sm" data-a="printQuote" data-id="${q.id}">${ic('printer')} In</button>
      <button class="btn gh sm" data-a="editQuote" data-id="${q.id}">Sửa</button>
      ${isMgr()?`<button class="btn dg sm" data-a="delQuote" data-id="${q.id}">Xoá</button>`:''}
    </div></div>`).join(''):'<div class="empty">Chưa có báo giá</div>'}`;
}

/* ---------- Mua hàng ---------- */
const ptotal=p=>p.items.reduce((s,i)=>s+i.qty*i.cost,0);
function purchaseForm(id){
  const o=db.purchases.find(x=>x.id===id)||{date:today(),paid:true,items:[{}],supplier:''};
  const sups=[...new Set(db.purchases.map(p=>p.supplier).filter(Boolean))];
  const m=modal(id?'Sửa phiếu '+o.code:'Phiếu mua hàng',`
    <label>Nhà cung cấp<input name="supplier" list="sups" value="${esc(o.supplier)}" required><datalist id="sups">${sups.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></label>
    ${fld('Ngày','date',o.date,'date','required')}
    <label>Hàng nhập</label><div id="items"></div>
    <button type="button" class="btn gh sm" id="addI" style="margin-top:8px">${ic('plus')} Thêm dòng</button>
    <label class="chk"><input type="checkbox" name="paid" ${o.paid?'checked':''}> Đã thanh toán</label>
    ${id?'':'<label class="chk"><input type="checkbox" name="upd" checked> Cập nhật giá vốn sản phẩm (bình quân)</label>'}
    ${fld('Ghi chú','note',o.note||'')}
    <div class="tot">Tổng: <b id="tot">0đ</b></div>`,
  (fd,m)=>{
    const items=readItems(m).map(i=>({pid:i.pid,name:i.name,qty:i.qty,cost:i.price}));
    if(!items.length){alert('Cần ít nhất 1 dòng hàng hợp lệ');return false}
    if(id)o.items.forEach(i=>{const p=prod(i.pid);if(p)p.stock-=i.qty});
    items.forEach(i=>{const p=prod(i.pid);if(!p)return;
      if(!id&&fd.get('upd')==='on'){const base=Math.max(p.stock,0);p.cost=(base+i.qty)>0?Math.round((base*p.cost+i.qty*i.cost)/(base+i.qty)):i.cost}
      p.stock+=i.qty});
    const data={supplier:fd.get('supplier'),date:fd.get('date'),paid:fd.get('paid')==='on',note:fd.get('note'),items};
    if(id)Object.assign(o,data);else db.purchases.push({id:uid(),code:'MH'+String(++db.pseq).padStart(4,'0'),...data});
    save();render();
  });
  itemEditor(m,o.items.map(i=>({...i,price:i.cost})));
  m.querySelectorAll('.pr').forEach(x=>x.placeholder='Giá nhập');
  m.addEventListener('change',e=>{if(e.target.classList.contains('p')){const p=prod(e.target.value);if(p){const pr=e.target.closest('.it').querySelector('.pr');pr.value=p.cost;pr.dispatchEvent(new Event('input',{bubbles:true}))}}});
}
function buys(){
  const mk=today().slice(0,7);
  const list=[...db.purchases].sort((a,b)=>b.date.localeCompare(a.date)||b.code.localeCompare(a.code));
  const mon=db.purchases.filter(p=>p.date.startsWith(mk)).reduce((s,p)=>s+ptotal(p),0);
  const debt=db.purchases.filter(p=>!p.paid).reduce((s,p)=>s+ptotal(p),0);
  return`<div class="row sp"><h2>Mua hàng</h2><button class="btn" data-a="newPurchase">${ic('plus')} Phiếu mua</button></div>
  <div class="grid"><div class="card kpi"><small>Mua tháng này</small><b>${vnd(mon)}</b></div><div class="card kpi"><small>Nợ nhà cung cấp</small><b class="${debt?'neg':''}">${vnd(debt)}</b></div></div>
  ${list.length?list.map(p=>`<div class="card">
    <div class="row sp"><b>${p.code} · ${esc(p.supplier)}</b><b>${vnd(ptotal(p))}</b></div>
    <div class="mut">${p.date} · ${p.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div>
    ${p.note?`<div class="mut">${ic('pencil')} ${esc(p.note)}</div>`:''}
    <div class="row" style="margin-top:8px">
      <span class="badge ${p.paid?'ok':'wr'}" data-a="ppay" data-id="${p.id}" style="cursor:pointer">${p.paid?'Đã trả':'Chưa trả'}</span>
      <button class="btn sm" data-a="pdfPurchase" data-id="${p.id}">${ic('pdf')} PDF</button>
      <button class="btn gh sm" data-a="printPurchase" data-id="${p.id}">${ic('printer')} In</button>
      <button class="btn gh sm" data-a="editPurchase" data-id="${p.id}">Sửa</button>
      <button class="btn dg sm" data-a="delPurchase" data-id="${p.id}">Xoá</button>
    </div></div>`).join(''):'<div class="empty">Chưa có phiếu mua hàng</div>'}`;
}

const views={home,orders,quote:quotes,cust:custs,prod:prods,buy:buys,exp:exps,more,team};
function whoHTML(){
  if(!CLOUD||!me||session==='out')return'';
  return`${esc(me.name||me.email)} · ${ROLE_NAME[me.role]||''} <button class="btn" data-a="logout">Thoát</button>`;
}
function authView(){
  const box=h=>`<div class="auth card">${h}</div>`;
  if(session==='loading')return box('<div class="empty">Đang tải…</div>');
  if(session==='error')return box(`<div class="bigic neg">${ic('alert')}</div><h2>Có lỗi</h2><p class="mut">${esc(authMsg)}</p><button class="btn" onclick="location.reload()">Tải lại trang</button> <button class="btn gh" data-a="logout">Đăng xuất</button>`);
  if(session==='pending')return box(`<div class="bigic">${ic('clock')}</div><h2>Đang chờ chủ duyệt</h2><p class="mut">Tài khoản <b>${esc(me.email)}</b> đã đăng ký. Khi chủ cửa hàng duyệt và chọn cấp cho bạn, trang này sẽ tự mở vào app.</p><button class="btn gh" data-a="logout">Đăng xuất</button>`);
  if(session==='blocked')return box(`<div class="bigic neg">${ic('ban')}</div><h2>Tài khoản bị khoá</h2><p class="mut">Tài khoản <b>${esc(me.email)}</b> không được phép truy cập. Hãy liên hệ chủ cửa hàng.</p><button class="btn gh" data-a="logout">Đăng xuất</button>`);
  return box(`<div class="bigic">${ic('tag')}</div><h2>iDecal</h2><p class="mut">Đăng nhập hoặc đăng ký bằng Gmail. Lần đầu đăng nhập, tài khoản sẽ chờ chủ cửa hàng duyệt và phân quyền.</p>
  ${authMsg?`<p class="neg">${esc(authMsg)}</p>`:''}
  <button class="btn" data-a="login" style="width:100%;padding:12px">${ic('login')} Đăng nhập / Đăng ký bằng Google</button>
  <p class="mut" style="margin-top:14px;font-size:12px">Nếu mở trong Zalo/Facebook mà không đăng nhập được, hãy mở link bằng Chrome hoặc Safari.</p>`);
}
function render(){
  $('#who').innerHTML=whoHTML();
  if(CLOUD&&session!=='ready'){$('#nav').innerHTML='';$('#app').innerHTML=authView();return}
  const tabs=tabsFor();if(!tabs.some(t=>t[0]===view))view='home';
  $('#nav').innerHTML=tabs.map(t=>`<button class="${t[0]===view?'on':''}" data-a="tab" data-id="${t[0]}"><b>${ic(t[1])}</b>${t[2]}</button>`).join('');
  $('#app').innerHTML=(!CLOUD&&!LS?WARN:'')+views[view]();
}

  newQuote:()=>quoteForm(),editQuote:id=>quoteForm(id),printQuote:id=>printQuote(id),pdfQuote:id=>pdfQuote(id),printPurchase:id=>printPurchase(id),pdfPurchase:id=>pdfPurchase(id),shop:()=>shopForm(),
  delQuote:id=>{if(confirm('Xoá báo giá này?')){db.quotes=db.quotes.filter(q=>q.id!==id);save();render()}},
  toOrder:id=>convertQuote(db.quotes.find(x=>x.id===id)),viewOrder:()=>{filter='Tất cả';view='orders';render();scrollTo(0,0)},
  newPurchase:()=>purchaseForm(),editPurchase:id=>purchaseForm(id),
  ppay:id=>{const p=db.purchases.find(x=>x.id===id);p.paid=!p.paid;save();render()},
  delPurchase:id=>{if(!confirm('Xoá phiếu này? Tồn kho sẽ được trừ lại số đã nhập.'))return;const o=db.purchases.find(x=>x.id===id);o.items.forEach(i=>{const p=prod(i.pid);if(p)p.stock-=i.qty});db.purchases=db.purchases.filter(x=>x.id!==id);save();render()},
  login:()=>login(),
  logout:()=>{if(auth)auth.signOut()},
  delUser:id=>{if(confirm('Xoá thành viên này? Họ vẫn có thể đăng ký lại và sẽ ở trạng thái chờ duyệt.'))fs.collection('users').doc(id).delete().catch(e=>toast('Lỗi: '+e.message))},
  migrate:()=>{
    let d;try{d=JSON.parse(LS.getItem(KEY))}catch(e){return}
    if(!d||!confirm('Đưa dữ liệu cũ trên máy này lên đám mây? Mục trùng mã sẽ giữ bản trên đám mây.'))return;
    let n=0;COLS.forEach(c=>(d[c]||[]).forEach(x=>{if(!db[c].some(y=>y.id===x.id)){db[c].push(x);n++}}));
    db.seq=Math.max(db.seq||0,d.seq||0);db.qseq=Math.max(db.qseq||0,d.qseq||0);db.pseq=Math.max(db.pseq||0,d.pseq||0);
    if(!(db.shop&&db.shop.name)&&d.shop)db.shop=d.shop;
    save();render();toast('Đã đưa '+n+' mục lên đám mây','ok');
  },
  zoom:id=>{
    const p=prod(id);if(!p||!p.img)return;
    const m=document.createElement('div');m.className='ov';m.style.alignItems='center';
    m.innerHTML=`<div class="md" style="text-align:center;border-radius:16px"><b>${esc(p.name)}</b><div style="margin:10px 0"><img src="${esc(p.img)}" alt="" referrerpolicy="no-referrer" style="max-width:100%;max-height:65vh;border-radius:8px" onerror="imgFail(this)"></div><button class="btn gh" data-x>Đóng</button></div>`;
    document.body.appendChild(m);
    m.onclick=e=>{if(e.target===m||e.target.hasAttribute('data-x'))m.remove()};
  },
  newExp:()=>expForm(),
  delExp:id=>{db.expenses=db.expenses.filter(e=>e.id!==id);save();render()},
  export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='idecal-backup-'+today()+'.json';a.click()},
  import:()=>$('#file').click(),
  reset:()=>{if(CLOUD)return;if(confirm('Xoá TOÀN BỘ dữ liệu? Không thể hoàn tác.')){if(LS)LS.removeItem(KEY);db=blank();render()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)acts[b.dataset.a](b.dataset.id)});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('rl')){fs.collection('users').doc(e.target.dataset.id).update({role:e.target.value}).then(()=>toast('Đã cập nhật cấp','ok')).catch(x=>toast('Lỗi: '+x.message));return}
  if(e.target.classList.contains('qs')){const q=db.quotes.find(x=>x.id===e.target.dataset.id);q.status=e.target.value;if(q.status==='Chấp nhận'){convertQuote(q);return}save();render();return}
  if(e.target.classList.contains('st')){const o=db.orders.find(x=>x.id===e.target.dataset.id);const was=o.status;o.status=e.target.value;
    if(was!=='Huỷ'&&o.status==='Huỷ')o.items.forEach(i=>{const p=prod(i.pid);if(p)p.stock+=i.qty});
    if(was==='Huỷ'&&o.status!=='Huỷ')o.items.forEach(i=>{const p=prod(i.pid);if(p)p.stock-=i.qty});
    save();render()}
});
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.orders)throw 0;if(confirm('Ghi đè dữ liệu hiện tại bằng file sao lưu?')){db=Object.assign(blank(),d);save();render()}}catch(_){alert('File không hợp lệ')}};r.readAsText(f);e.target.value=''};
if(CLOUD)initCloud();else render();
</script>
</body>
</html>
