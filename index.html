<head>

<style>
:root{--bg:#f3f7fb;--card:#fff;--tx:#142238;--mut:#64748b;--pri:#0879c9;--ok:#16845b;--warn:#c47a08;--bad:#d83b4b;--bd:#dfe8f1}
:root{--bg:#f3f7fb;--card:#fff;--tx:#142238;--mut:#64748b;--pri:#0879c9;--ok:#16845b;--warn:#c47a08;--bad:#d83b4b;--bd:#dfe8f1;--hh:57px}
@media(prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1c1f28;--tx:#e8eaf0;--mut:#9aa1b2;--bd:#2c303c}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px}
body{margin:0;font:15px/1.5 Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(115deg,#052a59,#0879c9);color:#fff;padding:16px 20px;font-weight:700;font-size:18px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{font-size:12px;font-weight:400;display:flex;align-items:center;gap:6px;text-align:right}
.who .btn{padding:3px 8px;font-size:12px;background:transparent;color:#fff;border:1px solid #fff9}
.auth{max-width:380px;margin:40px auto;text-align:center;padding:24px}
.auth h2{margin-top:4px}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.logo{display:flex;align-items:center;gap:8px}.logo .i{width:22px;height:22px}
.bigic{color:var(--pri);margin-bottom:4px}.bigic.neg{color:var(--bad)}.bigic .i{width:44px;height:44px;stroke-width:1.5}
.toast{display:flex;align-items:center;gap:8px}.toast .i{width:18px;height:18px}.toast.ok .i{color:#4ade80}.toast.err .i{color:#fca5a5}
.pth .i{width:26px;height:26px;stroke-width:1.5;color:var(--mut)}
.pc{display:flex;gap:12px;align-items:flex-start}
.pth{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg);border:1px solid var(--bd);cursor:zoom-in}
.noimg{display:flex;align-items:center;justify-content:center;font-size:26px;cursor:default}
.pv{margin:6px 0;min-height:24px}
.pv img{max-width:100%;max-height:180px;border-radius:10px;border:1px solid var(--bd)}
main{max-width:1080px;margin:0 auto;padding:22px 18px}
nav{position:fixed;top:57px;bottom:0;left:0;width:238px;background:var(--card);border-right:1px solid var(--bd);box-shadow:5px 0 16px #183b5b08;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:18px 12px;z-index:6;overflow-y:auto;scrollbar-width:thin}
nav button{width:100%;flex:0 0 auto;justify-content:flex-start;border:1px solid transparent;background:transparent;color:var(--mut);padding:10px 12px;border-radius:11px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:10px;white-space:normal;text-align:left}
nav button .count{margin-left:auto;border-radius:99px;min-width:25px;padding:2px 7px;text-align:center;background:#e0f2fe;color:#075985;font-size:12px;font-weight:700}
body{padding-bottom:0}
@media(min-width:561px){main{margin-left:238px;max-width:calc(1080px + 0px);padding:22px 24px}header{padding-left:20px}}

nav button{flex:0 0 auto;border:1px solid transparent;background:transparent;color:var(--mut);padding:8px 12px;border-radius:11px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
nav button b{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;margin:0;padding:0;border-radius:8px;background:#eef2ff;font-weight:400;line-height:1;transition:background .15s}
nav button .i{width:19px;height:19px;stroke-width:1.9}
nav button:nth-child(1) b{background:#e0f2fe;color:#0284c7}
nav button:nth-child(2) b{background:#dcfce7;color:#16a34a}
nav button:nth-child(3) b{background:#f3e8ff;color:#9333ea}
nav button:nth-child(4) b{background:#ffedd5;color:#ea580c}
nav button:nth-child(5) b{background:#ccfbf1;color:#0f766e}
nav button:nth-child(6) b{background:#fef3c7;color:#b45309}
nav button:nth-child(7) b{background:#ffe4e6;color:#e11d48}
nav button:nth-child(8) b{background:#e0e7ff;color:#4f46e5}
nav button.on{background:#eff6ff;border-color:#bfdbfe;color:#075985;font-weight:700}
nav button.on b{filter:saturate(1.2);box-shadow:inset 0 0 0 1px currentColor}
@media(max-width:560px){nav{top:55px;bottom:auto;left:0;right:0;width:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--bd);padding:6px 8px;gap:3px;overflow-x:auto;overflow-y:hidden;white-space:nowrap}nav button{width:auto;justify-content:flex-start;padding:7px 9px;font-size:12px;white-space:nowrap}nav button .count{margin-left:0;min-width:20px;padding:1px 5px}nav button b{width:23px;height:23px}main{margin-left:0;padding-top:78px;padding-bottom:18px}body{padding-bottom:0}}
main{padding-top:78px;padding-bottom:20px}
nav{position:fixed;top:var(--hh);bottom:0;left:0;width:238px;background:var(--card);border-right:1px solid var(--bd);box-shadow:5px 0 16px #183b5b08;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:14px 12px calc(16px + env(safe-area-inset-bottom));z-index:6;overflow-y:auto;scrollbar-width:thin}
.nav-head{display:none}
.nav-group{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin:14px 8px 4px;padding-top:12px;border-top:1px solid var(--bd)}
.navi{width:100%;flex:0 0 auto;min-height:44px;display:flex;align-items:center;gap:10px;justify-content:flex-start;border:1px solid transparent;background:transparent;color:var(--mut);padding:8px 10px;border-radius:12px;font-size:14px;font-family:inherit;cursor:pointer;white-space:normal;text-align:left}
.navi .ni{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;border-radius:9px;background:#eef2ff;font-weight:400;color:var(--mut);line-height:1;transition:box-shadow .15s}
.navi .ni .i{width:19px;height:19px;stroke-width:1.9}
.navi .count{margin-left:auto;border-radius:99px;min-width:25px;padding:2px 7px;text-align:center;background:#e0f2fe;color:#075985;font-size:12px;font-weight:700}
.navi.on{background:#eff6ff;border-color:#bfdbfe;color:#075985;font-weight:700}
.navi.on .ni{box-shadow:inset 0 0 0 1.5px currentColor}
.ni-sky{background:#e0f2fe;color:#0284c7}.ni-green{background:#dcfce7;color:#16a34a}.ni-purple{background:#f3e8ff;color:#9333ea}
.ni-orange{background:#ffedd5;color:#ea580c}.ni-teal{background:#ccfbf1;color:#0f766e}.ni-amber{background:#fef3c7;color:#b45309}
.ni-rose{background:#ffe4e6;color:#e11d48}.ni-indigo{background:#e0e7ff;color:#4f46e5}.ni-slate{background:#f1f5f9;color:#475569}
.burger{display:none;flex:none;width:44px;height:44px;align-items:center;justify-content:center;border:0;background:transparent;color:#fff;border-radius:10px;cursor:pointer}
.burger .i{width:24px;height:24px}
.htitle{display:none}
.nav-scrim{display:none}
@media(min-width:561px){main{margin-left:238px;max-width:1080px;padding:22px 24px}header{padding-left:20px}}
@media(max-width:560px){
nav{top:0;bottom:0;left:0;right:auto;width:min(84vw,320px);transform:translateX(-100%);transition:transform .22s ease;z-index:30;box-shadow:0 0 40px #0006;border-right:1px solid var(--bd);padding:calc(14px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
body.nav-open nav{transform:translateX(0)}
body.nav-open{overflow:hidden}
.nav-scrim{display:block;position:fixed;inset:0;background:#0009;z-index:29;opacity:0;pointer-events:none;transition:opacity .2s}
body.nav-open .nav-scrim{opacity:1;pointer-events:auto}
.nav-head{display:flex;align-items:center;gap:8px;padding:2px 8px 12px;margin-bottom:2px;border-bottom:1px solid var(--bd);font-weight:700;font-size:16px;color:var(--tx)}
.burger{display:inline-flex}
.lname{display:none}
.htitle{display:block;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.who .who-txt{display:none}
main{margin-left:0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
}
@media(prefers-color-scheme:dark){.navi.on{background:#0b2c46;border-color:#1b4a72;color:#bfe3ff}.stage.on{background:#0b2c46;border-color:#1b4a72;color:#bfe3ff}.stage.on .stage-n{color:#bfe3ff}}
@media(prefers-reduced-motion:reduce){nav,.nav-scrim,.navi .ni{transition:none}}
main{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid #e3ebf3;border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 5px 18px #183b5b08}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.kpi small{color:var(--mut);display:block}
.kpi b{font-size:18px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:12px}
.sp{justify-content:space-between}
